<script type="importmap">

<body>
<div id="hud">1 / 2 / 3 切換鏡頭 · 滑鼠微移視角</div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------ params */
const Q = new URLSearchParams(location.search);
const FIXED = Q.has('t');                       // 截圖模式：固定時間、固定鏡頭
let camIndex = parseInt(Q.get('cam') ?? '0');
const SHOW_FPS = Q.has('fps');
if (FIXED || SHOW_FPS) document.getElementById('hud').style.display = FIXED ? 'none' : 'block';

/* ------------------------------------------------------------------ renderer */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
let basePR = Math.min(window.devicePixelRatio, 1.5);
let pr = Q.has('pr') ? parseFloat(Q.get('pr')) : basePR;
renderer.setPixelRatio(pr);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.info.autoReset = false;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xc98a6c, 0.0011);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.3, 9000);

/* ------------------------------------------------------------------ shared GLSL: sky */
const SUN_DIR = new THREE.Vector3(0.28, 0.055, -1).normalize();
const uniforms = {
  uTime: { value: 0 },
  uSunDir: { value: SUN_DIR },
};

const GLSL_COMMON = /* glsl */`
uniform float uTime;
uniform vec3 uSunDir;
float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  float a=h21(i), b=h21(i+vec2(1,0)), c=h21(i+vec2(0,1)), d=h21(i+vec2(1,1));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
float fbm5(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=p*2.03+vec2(17.1,9.7); a*=0.5; } return s; }
float fbm3(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<3;i++){ s+=a*vnoise(p); p=p*2.03+vec2(17.1,9.7); a*=0.5; } return s; }

vec3 skyGradient(vec3 d){
  float e = clamp(d.y, 0.0, 1.0);
  float sd = max(dot(d, uSunDir), 0.0);
  vec3 zen = vec3(0.018,0.040,0.150);
  vec3 mid = vec3(0.26,0.14,0.32);
  vec3 low = vec3(0.95,0.34,0.15);
  vec3 hor = vec3(1.7,0.58,0.20);
  vec3 col = mix(hor, low, smoothstep(0.0,0.10,e));
  col = mix(col, mid, smoothstep(0.07,0.38,e));
  col = mix(col, zen, smoothstep(0.30,0.95,e));
  // 太陽側暖暈、背陽側冷暗
  float az = 0.5 + 0.5*dot(normalize(d.xz+1e-4), normalize(uSunDir.xz));
  col *= mix(0.55, 1.0, az);
  col += vec3(1.1,0.42,0.14) * pow(sd,5.0) * exp(-e*6.0);
  col += vec3(1.8,0.7,0.24) * pow(sd,90.0);
  col += vec3(0.5,0.40,0.32) * exp(-pow((acos(clamp(dot(d,uSunDir),-1.0,1.0)) - 0.385)/0.022, 2.0)) * 0.35 * smoothstep(0.02,0.2,e);   // 22° 日暈
  return col;
}
float sunDisc(vec3 d){
  float c = dot(d, uSunDir);
  return smoothstep(0.99992, 0.99997, c);
}
vec3 skyColor(vec3 d, float clouds){
  vec3 col = skyGradient(d);
  if(clouds > 0.0 && d.y > 0.004){
    float sd = max(dot(d, uSunDir), 0.0);
    vec2 sdir = normalize(uSunDir.xz);
    vec2 p = d.xz/(d.y+0.10)*0.55 + vec2(uTime*0.011, uTime*0.0025);
    p *= vec2(1.0, 1.7);
    float base = fbm5(p);
    float cov = smoothstep(0.50, 0.74, base);
    float toward = fbm5(p + sdir*vec2(1.0,1.7)*0.05);
    float lit = clamp((base - toward)*13.0 + 0.42, 0.0, 1.0);
    vec3 sunSide  = vec3(1.9,0.72,0.28);
    vec3 shade    = vec3(0.11,0.06,0.15);
    vec3 pinkSide = vec3(0.65,0.30,0.42);
    vec3 warm = mix(pinkSide, sunSide, pow(sd,0.7));
    vec3 cc = mix(shade, warm, lit);
    cc += vec3(2.0,0.9,0.4) * pow(sd,10.0) * (1.0-cov) * cov * 4.0; // 銀邊
    float fade = smoothstep(0.004, 0.16, d.y);
    col = mix(col, cc, cov * fade * clouds);
    // 中層碎積雲：小塊、被夕陽鑲邊
    if(clouds > 0.95){
      vec2 p2 = d.xz/(d.y+0.22)*1.5 + vec2(uTime*0.02, 7.0);
      float b2 = fbm5(p2), t2 = fbm5(p2 + sdir*0.06);
      float c2 = smoothstep(0.56,0.74,b2) * smoothstep(0.10,0.30,d.y) * (0.35 + 0.65*pow(sd,0.5));
      float l2 = clamp((b2-t2)*14.0+0.4, 0.0, 1.0);
      vec3 cc2 = mix(vec3(0.14,0.07,0.16), mix(vec3(0.7,0.32,0.45), vec3(2.2,0.95,0.42), pow(sd,0.8)), l2);
      col = mix(col, cc2, c2*0.85);
    }
    // 高空卷雲
    vec2 q = d.xz/(d.y+0.35)*vec2(0.5,2.6) + vec2(uTime*0.006,3.3);
    float ci = smoothstep(0.5,0.9,fbm3(q*1.7));
    col = mix(col, mix(vec3(0.55,0.25,0.38), vec3(1.9,0.8,0.4), pow(sd,1.2)), ci*0.55*smoothstep(0.08,0.4,d.y)*clouds);
  }
  return col;
}
`;

/* ------------------------------------------------------------------ sky dome */
const skyMat = new THREE.ShaderMaterial({
  uniforms,
  side: THREE.BackSide, depthWrite: false, depthTest: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix*modelViewMatrix*vec4(position,1.0); gl_Position = p.xyww; }`,
  fragmentShader: GLSL_COMMON + `
  varying vec3 vDir;
  void main(){
    vec3 d = normalize(vDir);
    vec3 col = skyColor(d, 1.0);
    float s = sunDisc(d);
    col += vec3(28.0,13.0,4.5)*s;
    gl_FragColor = vec4(col,1.0);
  }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 48, 24), skyMat);
sky.renderOrder = -10; sky.frustumCulled = false;
scene.add(sky);

/* 環境貼圖：把天空烘成 PMREM 供 PBR 材質使用 */
{
  const envScene = new THREE.Scene();
  const envSky = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), new THREE.ShaderMaterial({
    uniforms, side: THREE.BackSide, depthWrite: false,
    vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: GLSL_COMMON + `varying vec3 vDir; void main(){ vec3 d=normalize(vDir); gl_FragColor=vec4(min(skyColor(d,1.0),vec3(6.0)),1.0);} `
  }));
  envScene.add(envSky);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(envScene, 0.02).texture;
  scene.environmentIntensity = 0.7;
  pm.dispose();
}

/* ------------------------------------------------------------------ lights */
const sun = new THREE.DirectionalLight(0xff9440, 5.2);
sun.position.copy(SUN_DIR).multiplyScalar(120).add(new THREE.Vector3(0, 0, 8));
sun.target.position.set(0, 2, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(3072, 3072);
Object.assign(sun.shadow.camera, { left: -34, right: 34, top: 34, bottom: -34, near: 10, far: 260 });
sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
// 補光：天空紫藍從上方、地面暖橘反彈，讓背光面不至於死黑
const fill = new THREE.HemisphereLight(0x8072b8, 0x9a6038, 0.62);
scene.add(fill);

/* ------------------------------------------------------------------ procedural textures */
function rng(seed){ let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

function concreteTextures(seed, { w = 1024, h = 1024, cols = 0, rows = 0, ties = false, stain = 1, cracks = 3, base = [143,138,130], pores = 500, speck = 3000 } = {}){
  const r = rng(seed);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = `rgb(${base})`; g.fillRect(0, 0, w, h);
  // 大塊色斑（模板灌漿的濃淡差）
  for (let i = 0; i < 140; i++){
    const x = r()*w, y = r()*h, rad = 30 + r()*(w*0.22), v = r() < 0.5 ? 255 : 0, a = 0.05 + r()*0.07;
    const gr = g.createRadialGradient(x,y,0,x,y,rad);
    gr.addColorStop(0, `rgba(${v},${v},${v},${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x-rad, y-rad, rad*2, rad*2);
  }
  // 骨材顆粒（亮暗混雜）
  for (let i = 0; i < speck; i++){
    const v = r() < 0.5 ? 200 + r()*40 : 60 + r()*40;
    g.fillStyle = `rgba(${v},${v-4},${v-10},${0.18+r()*0.3})`;
    const sz = 0.6 + r()*1.7; g.fillRect(r()*w, r()*h, sz, sz);
  }
  // 氣孔
  for (let i = 0; i < pores; i++){
    const x = r()*w, y = r()*h, rr = 0.7 + r()*2.6;
    g.fillStyle = `rgba(30,27,24,${0.4+r()*0.4})`; g.beginPath(); g.ellipse(x, y, rr, rr*(0.7+r()*0.5), r()*3, 0, 7); g.fill();
    g.fillStyle = 'rgba(210,205,195,0.25)'; g.beginPath(); g.arc(x+rr*0.5, y+rr*0.6, rr*0.55, 0, 7); g.fill();
  }
  // 雨痕與析出白華
  for (let i = 0; i < 34*stain; i++){
    const x = r()*w, y = r()*h*0.7, len = h*(0.1 + r()*0.4), wd = 2 + r()*12;
    const gr = g.createLinearGradient(0,y,0,y+len);
    const tint = r() < 0.7 ? '52,46,38' : '215,210,200';
    gr.addColorStop(0,`rgba(${tint},0)`); gr.addColorStop(0.12,`rgba(${tint},0.24)`); gr.addColorStop(1,`rgba(${tint},0)`);
    g.fillStyle = gr; g.fillRect(x, y, wd, len);
  }
  // 裂縫（隨機折線 + 細分岔）
  g.lineCap = 'round';
  for (let i = 0; i < cracks; i++){
    let x = r()*w, y = r()*h; const dir = r()*6.28; g.strokeStyle = 'rgba(28,25,22,0.85)'; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(x,y);
    for (let k = 0; k < 24; k++){ x += Math.cos(dir + (r()-0.5)*1.4)*(6+r()*10); y += Math.sin(dir + (r()-0.5)*1.4)*(6+r()*10); g.lineTo(x,y); }
    g.stroke();
  }
  // 模板接縫與繫桿孔
  if (cols || rows){
    g.strokeStyle = 'rgba(34,31,28,0.9)'; g.lineWidth = 3;
    for (let i = 0; i < cols; i++){ const x = i*w/cols + 1.5; g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); g.strokeStyle='rgba(235,230,220,0.18)'; g.lineWidth=2; g.beginPath(); g.moveTo(x+3,0); g.lineTo(x+3,h); g.stroke(); g.strokeStyle='rgba(34,31,28,0.9)'; g.lineWidth=3; }
    for (let i = 0; i < rows; i++){ const y = i*h/rows + 1.5; g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
  }
  if (ties){
    const cx = Math.max(cols,1), cy = Math.max(rows,1);
    for (let i = 0; i < cx*2; i++) for (let j = 0; j < cy*2; j++){
      const x = (i+0.5)*w/(cx*2), y = (j+0.5)*h/(cy*2);
      g.fillStyle = 'rgba(25,22,20,0.85)'; g.beginPath(); g.arc(x,y,7,0,7); g.fill();
      g.strokeStyle = 'rgba(200,196,188,0.4)'; g.lineWidth = 2; g.beginPath(); g.arc(x,y,9,0.2,2.6); g.stroke();
      const gr = g.createLinearGradient(0,y,0,y+140); gr.addColorStop(0,'rgba(70,52,36,0.35)'); gr.addColorStop(1,'rgba(70,52,36,0)');
      g.fillStyle = gr; g.fillRect(x-4,y,8,140);   // 鏽水痕
    }
  }
  const map = new THREE.CanvasTexture(c);
  map.colorSpace = THREE.SRGBColorSpace; map.wrapS = map.wrapT = THREE.RepeatWrapping; map.anisotropy = 8;
  const bump = new THREE.CanvasTexture(c);
  bump.wrapS = bump.wrapT = THREE.RepeatWrapping; bump.anisotropy = 8;
  return { map, bump };
}

/* 退化三角形會產生零長度法線 → shader 內 normalize(0)=NaN → bloom 把整片染黑，所以補上預設法線 */
function fixNormals(g){
  const n = g.attributes.normal;
  for (let i = 0; i < n.count; i++){
    const l = n.getX(i)**2 + n.getY(i)**2 + n.getZ(i)**2;
    if (!(l > 1e-8)) n.setXYZ(i, 0, 1, 0);
  }
}

/* 柏油：顆粒 + 補丁 + 白線 */
function asphaltTextures(){
  const r = rng(3), w = 1024, h = 1024, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.fillStyle = '#4a4848'; g.fillRect(0,0,w,h);
  for (let i = 0; i < 26000; i++){ const v = 40 + r()*110|0; g.fillStyle = `rgba(${v},${v},${v+2},${0.25+r()*0.4})`; const s = 0.8 + r()*2.2; g.fillRect(r()*w, r()*h, s, s); }
  for (let i = 0; i < 6; i++){ const x = r()*w, y = r()*h; g.fillStyle = 'rgba(20,20,22,0.25)'; g.fillRect(x, y, 80+r()*200, 40+r()*120); }
  g.strokeStyle = 'rgba(25,25,26,0.8)'; g.lineWidth = 2;
  for (let i = 0; i < 4; i++){ let x = r()*w, y = r()*h; g.beginPath(); g.moveTo(x,y); for (let k = 0; k < 18; k++){ x += (r()-0.3)*24; y += (r()-0.5)*14; g.lineTo(x,y);} g.stroke(); }
  const map = new THREE.CanvasTexture(c); map.colorSpace = THREE.SRGBColorSpace; map.wrapS = map.wrapT = THREE.RepeatWrapping; map.anisotropy = 8;
  const bump = new THREE.CanvasTexture(c); bump.wrapS = bump.wrapT = THREE.RepeatWrapping; bump.anisotropy = 8;
  return { map, bump };
}

/* 木紋 */
function woodTexture(){
  const r = rng(8), w = 512, h = 128, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.fillStyle = '#7a5538'; g.fillRect(0,0,w,h);
  for (let i = 0; i < 90; i++){ const y = r()*h, v = 40 + r()*60|0; g.strokeStyle = `rgba(${v},${v*0.6|0},${v*0.35|0},${0.25+r()*0.3})`; g.lineWidth = 0.6 + r()*1.6;
    g.beginPath(); g.moveTo(0,y); for (let x = 0; x <= w; x += 32) g.lineTo(x, y + Math.sin(x*0.02+i)*2 + (r()-0.5)*1.2); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

function radialTexture(stops){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(64,64,0,64,64,64);
  stops.forEach(([o,col]) => gr.addColorStop(o,col));
  g.fillStyle = gr; g.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

/* 濕度：浪線以下變暗、藻類、藤壺，並讓潮濕處變光滑 */
function makeWet(mat, { wetTop = 1.2, dryBelow = 0.2, barnacle = 1.0 } = {}){
  mat.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWP;')
      .replace('#include <project_vertex>', `#include <project_vertex>
        vec4 wpp = vec4(transformed,1.0);
        #ifdef USE_INSTANCING
          wpp = instanceMatrix * wpp;
        #endif
        vWP = (modelMatrix*wpp).xyz;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWP;
        float wh(vec3 p){ p = fract(p*0.3183099+vec3(.1,.2,.3)); p += dot(p,p.yzx+19.19); return fract((p.x+p.y)*p.z); }
        float wn(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
          return mix(mix(mix(wh(i),wh(i+vec3(1,0,0)),f.x), mix(wh(i+vec3(0,1,0)),wh(i+vec3(1,1,0)),f.x), f.y),
                     mix(mix(wh(i+vec3(0,0,1)),wh(i+vec3(1,0,1)),f.x), mix(wh(i+vec3(0,1,1)),wh(i+vec3(1,1,1)),f.x), f.y), f.z); }
        float gWet;`)
      .replace('#include <map_fragment>', `#include <map_fragment>
        float nz = wn(vWP*3.1)*0.6 + wn(vWP*9.0)*0.4;
        float wetY = vWP.y + (nz-0.5)*0.55;
        gWet = 1.0 - smoothstep(${dryBelow.toFixed(2)}, ${wetTop.toFixed(2)}, wetY);
        vec3 wetCol = diffuseColor.rgb*vec3(0.32,0.36,0.32);
        // 藻類：浪線附近的綠褐色鬍鬚
        float algae = smoothstep(0.35,0.75,wn(vWP*vec3(6.0,14.0,6.0))) * (1.0 - smoothstep(-0.2,0.9,wetY)) * smoothstep(-1.4,0.0,wetY);
        wetCol = mix(wetCol, vec3(0.11,0.16,0.05), algae*0.85);
        diffuseColor.rgb = mix(diffuseColor.rgb, wetCol, gWet);
        // 藤壺 / 牡蠣殼：白灰小圓斑
        float bn = wn(vWP*vec3(28.0,28.0,28.0));
        float barn = smoothstep(0.74, 0.80, bn) * (1.0 - smoothstep(0.1, 0.75, wetY)) * ${barnacle.toFixed(2)};
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.62,0.6,0.55)*(0.6+0.6*wn(vWP*60.0)), barn);`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, 0.22, gWet*0.85);`);
  };
  return mat;
}

/* ------------------------------------------------------------------ geometry: embankment */
const world = new THREE.Group(); scene.add(world);
let foamCollars, fisherG, fisherRod, townLights;
const fisherRodBase = 0;
const TOP = 2.6;                                   // 步道高度

const cw = concreteTextures(11, { w: 1024, h: 1536, cols: 1, rows: 3, ties: true, cracks: 4 });
cw.map.repeat.set(50, 1); cw.bump.repeat.set(50, 1);
const wallMat = makeWet(new THREE.MeshStandardMaterial({ map: cw.map, bumpMap: cw.bump, bumpScale: 3.0, roughness: 0.9, metalness: 0 }));

const cp = concreteTextures(23, { cols: 1, rows: 1, stain: 0.3, cracks: 5, pores: 900, speck: 9000, base: [150,145,138] });
cp.map.repeat.set(66, 2); cp.bump.repeat.set(66, 2);
const pathMat = new THREE.MeshStandardMaterial({ map: cp.map, bumpMap: cp.bump, bumpScale: 2.2, roughness: 0.88, color: 0xe4ded6 });

function box(w,h,d,mat,x,y,z,{cast=true,recv=true}={}){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow = cast; m.receiveShadow = recv; world.add(m); return m;
}
const pm = cw.map.clone(), pb = cw.bump.clone();
pm.repeat.set(50, 0.09); pm.offset.y = 0.45; pb.repeat.set(50, 0.09); pb.offset.y = 0.45; pm.needsUpdate = pb.needsUpdate = true;

const waterMat = new THREE.ShaderMaterial({

      float fadeK = 1.0/(1.0 + dist*ks[i]*0.012);
      g += dirs[i]*ks[i]*amps[i]*cos(ph)*fadeK;
    }
    vec3 N = normalize(vec3(-g.x, 1.0, -g.y));
    // 波浪撞擊堤防的反彈：靠近牆面時加強擾動
    float nearWall = smoothstep(-9.0, -0.5, vW.z);
    N = normalize(N + vec3(0.06*sin(vW.x*1.7+uTime*1.3), 0.0, 0.05*cos(vW.x*0.9+uTime*0.9))*nearWall);

          const x = pp.getX(v), z = pp.getZ(v), d2 = (x*x+z*z)/(rad*rad);
          pp.setY(v, -0.55*d2 + 0.25*Math.sin(x*1.7+z*1.3+seed));                // 傘狀下垂
          const l = Math.hypot(x,z)+1e-3; nn.setXYZ(v, x/l*0.35, 1, z/l*0.35);
        }
        pg.rotateY(rr()*6.28 + layer*0.9); pg.translate(ox, y + layer*0.28, oz);
        const shade = 0.55 + rr()*0.5;
        tint(pg, (v) => { const h = Math.min(1, Math.max(0, (pg.attributes.position.getY(v) - (y-0.7))/1.1)); return [(0.05+0.09*h)*shade, (0.09+0.16*h)*shade, (0.035+0.05*h)*shade]; });
        parts.push(pg);
      }
    }
    return mergeGeometries(parts);
  };
  const mat = new THREE.MeshStandardMaterial({ map: needleTex, vertexColors: true, roughness: 1, alphaTest: 0.45, side: THREE.DoubleSide });
  const geos = [makeTree(3), makeTree(7), makeTree(12)];
  const per = 18, ims = geos.map(g => { const m = new THREE.InstancedMesh(g, mat, per); m.receiveShadow = true; world.add(m); return m; });
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), sc = new THREE.Vector3();
  for (let i = 0; i < per*3; i++){
    const g = i % 3, j = (i/3)|0, x = (i-27)*3.6 + (r()-0.5)*4, z = 19 + r()*10;
    const s0 = 0.9 + r()*0.7; p.set(x, TOP-0.5, z); e.set(0, r()*6.28, 0); q.setFromEuler(e); sc.set(s0, s0*(0.9+r()*0.4), s0);
    m4.compose(p,q,sc); ims[g].setMatrixAt(j, m4);
  }
}

/* ------------------------------------------------------------------ post */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// （試過 god-rays 徑向模糊後製：會把右下整片洗成霧、亮點被拖出方塊殘影，評估後移除）
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth/2, innerHeight/2), 0.32, 0.5, 2.4);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const finalPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec2 c = vUv-0.5;
      float vg = smoothstep(0.95, 0.25, length(c*vec2(1.0,1.15)));
      vec3 col = texture2D(tDiffuse, vUv).rgb;
      // 分離色調：陰影偏青紫、亮部偏暖
      float l = dot(col, vec3(0.299,0.587,0.114));
      col = mix(col, col*vec3(0.92,0.96,1.08), 1.0-smoothstep(0.0,0.35,l));
      col = mix(col, col*vec3(1.06,1.0,0.94), smoothstep(0.4,0.9,l));
      col *= mix(0.62, 1.0, vg);
      col += (hash(vUv*1000.0 + fract(uTime))-0.5)*0.018;
      gl_FragColor = vec4(col,1.0);
    }`
});
composer.addPass(finalPass);

/* ------------------------------------------------------------------ cameras */
const CAMS = [
  { pos: [-9, 4.55, 3.4],  look: [-20, 1.35, -56], fov: 52 },   // A 落日在右三分線，欄杆與矮牆引導視線
  { pos: [4.5, 4.75, 1.0], look: [-2.5, 0.2, -10],  fov: 56 },   // B 探出矮牆俯視消波塊與浪
  { pos: [-26, 4.0, 2.4],  look: [30, 4.3, -3.5],  fov: 58 },   // C 沿堤望去，路燈與欄杆透視
  { pos: [1.5, 3.5, 1.6],  look: [-2.5, 0.6, -4.5], fov: 55 },   // (除錯) 材質特寫：牆面與消波塊
  { pos: [-3, 3.5, 4.2],   look: [4, 2.6, 0.8],     fov: 55 },   // (除錯) 材質特寫：步道、矮牆、草
];
if (Q.has('dbg')) scene.add(new THREE.AmbientLight(0xffffff, 1.6));   // 僅供檢視材質細節，不列入評分截圖
const look = new THREE.Vector3(), mouse = new THREE.Vector2();
addEventListener('mousemove', e => { mouse.set(e.clientX/innerWidth-0.5, e.clientY/innerHeight-0.5); });
addEventListener('keydown', e => { const n = parseInt(e.key); if (n >= 1 && n <= 3) camIndex = n-1; });

function updateCamera(t){
  const c = CAMS[camIndex] ?? CAMS[0];
  const sway = FIXED ? 0 : 1;
  camera.position.set(c.pos[0] + Math.sin(t*0.21)*0.08*sway, c.pos[1] + Math.sin(t*0.5)*0.02*sway, c.pos[2]);
  look.set(c.look[0] + mouse.x*8*sway, c.look[1] - mouse.y*3*sway, c.look[2]);
  camera.lookAt(look);
  camera.fov = c.fov; camera.updateProjectionMatrix();
  sky.position.copy(camera.position);
}

/* ------------------------------------------------------------------ resize */
function resize(){
  renderer.setPixelRatio(pr);
  if (spray) spray.material.uniforms.uPx.value = innerHeight*pr/720;
  renderer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(pr); composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  finalPass.uniforms.uRes.value.set(innerWidth, innerHeight);
}
addEventListener('resize', resize); resize();

/* ------------------------------------------------------------------ loop */
const tmp = new THREE.Matrix4(), tq = new THREE.Quaternion(), te = new THREE.Euler(), tp = new THREE.Vector3(), ts = new THREE.Vector3(1,1,1);
function update(t){
  uniforms.uTime.value = t;
  water.position.y = 0.13*Math.sin(t*0.9) + 0.05*Math.sin(t*1.7+1.0);   // 潮汐湧動：水線在消波塊上起伏
  finalPass.uniforms.uTime.value = t;
  if (foamCollars) foamCollars.position.y = water.position.y + 0.06;
  updateCamera(t);
  // 騎單車的人（往返步道）
  {
    const L = 120, u = ((t*3.0) % (2*L)), dirf = u < L ? 1 : -1, x = -45 + (u < L ? u : 2*L - u);
    cyclist.position.set(x, TOP, 3.6 - (dirf > 0 ? 0 : 0.9)); cyclist.rotation.y = dirf > 0 ? 0 : Math.PI;
    cyclist.rotation.z = Math.sin(t*1.7)*0.02; cyclist.position.y = TOP + Math.abs(Math.sin(t*6.0))*0.006;
    cycWheels.forEach(w => w.rotation.z = -x/0.33);
    cycLegs.forEach((l, i) => { l.rotation.z = Math.sin(t*6.0 + i*Math.PI)*0.55; });
  }
  // 釣客：竿尖輕點、身體微晃
  fisherRod.rotation.z = fisherRodBase + Math.sin(t*1.9)*0.012 + Math.sin(t*0.7)*0.02; fisherG.rotation.z = Math.sin(t*0.6)*0.012;
  // 遠岸燈火閃爍、船燈明滅
  townLights.material.uniforms.uTime.value = t;
  // 燈塔光芒閃爍
  const pulse = 0.55 + 0.45*Math.max(0, Math.sin(t*1.4));
  beam.material.opacity = pulse; beamPivot.rotation.y = t*0.45;
  // 路燈暖光微顫
  lampBulbs.forEach((s, i) => { s.material.opacity = 0.5 + 0.03*Math.sin(t*3+i); });
  // 漁船起伏
  boats.forEach((b, i) => { b.position.x = b.userData.x + Math.sin(t*0.02 + i)*18 + t*0.15*(i%2 ? 1 : -1); b.position.y = Math.sin(t*0.8 + b.userData.ph)*0.25; b.rotation.z = Math.sin(t*0.6 + b.userData.ph)*0.03; });
  // 海鳥
  birdData.forEach((d, i) => {
    if (d.kind === 'circle'){
      const a = d.a + t*d.sp;
      tp.set(d.cx + Math.cos(a)*d.r, d.y + Math.sin(a*2.0+i)*1.6, d.cz + Math.sin(a)*d.r*0.5);
      te.set(0, -a + Math.PI, Math.sin(a*3)*0.25); ts.setScalar(0.7 + (i%3)*0.2);
    } else {
      // 一群海鳥由右向左飛越落日前，V 字隊形，每 55 秒一輪
      const k = d.k, lead = 46 - ((t*3.6) % 200);
      const side = (k%2 ? 1 : -1) * Math.ceil(k/2);
      tp.set(lead + side*2.6 + 4.5*Math.ceil(k/2), 15 + Math.sin(t*0.7 + k)*0.8 + Math.ceil(k/2)*0.3, -56 - side*2.4);
      te.set(0, Math.PI/2 + 0.08*Math.sin(t*0.9+k), 0.18*Math.sin(t*1.3+k*2)); ts.setScalar(0.55);
    }
    tq.setFromEuler(te); tmp.compose(tp, tq, ts); birds.setMatrixAt(i, tmp);
  });
  birds.instanceMatrix.needsUpdate = true;
}

const stats = { fps: 0, frameMs: 0, pr, calls: 0, tris: 0, samples: [] };
window.__stats = stats;
window.__dbg = { scene, camera, renderer, composer, render: (t) => { update(t); composer.render(); } };
let last = performance.now(), acc = 0, frames = 0, lowT = 0, highT = 0;
const clock0 = performance.now();

function frame(now){
  const dt = (now - last)/1000; last = now;
  const t = FIXED ? parseFloat(Q.get('t')) : (now - clock0)/1000;
  const c0 = performance.now();
  update(t);
  renderer.info.reset();
  composer.render();
  stats.frameMs = performance.now() - c0;
  // 統計 + 動態解析度
  acc += dt; frames++;
  if (acc >= 1){
    stats.fps = frames/acc; stats.samples.push(stats.fps); acc = 0; frames = 0;
    stats.calls = renderer.info.render.calls; stats.tris = renderer.info.render.triangles; stats.pr = pr;
    if (!FIXED && !Q.has('pr')){
      if (stats.fps < 52){ lowT++; highT = 0; } else if (stats.fps > 58){ highT++; lowT = 0; } else { lowT = highT = 0; }
      if (lowT >= 1 && pr > 0.6){ pr = Math.max(0.6, pr - 0.15); resize(); lowT = 0; }
      if (highT >= 4 && pr < basePR){ pr = Math.min(basePR, pr + 0.1); resize(); highT = 0; }
    }
    if (SHOW_FPS) document.getElementById('hud').textContent = `${stats.fps.toFixed(0)} fps · pr ${pr.toFixed(2)} · ${stats.calls} calls · ${(stats.tris/1000).toFixed(0)}k tris`;
  }
  if (FIXED){
    frameCount++;
    if (frameCount === 3){ renderer.getContext().finish(); window.__ready = true; return; }   // 截圖模式：畫完固定幀就停，避免截到半成品
  }
  requestAnimationFrame(frame);
}
let frameCount = 0;
requestAnimationFrame(frame);
// 效能基準：同步 finish 後量測平均每幀毫秒（供版本間相對比較；軟體渲染下絕對值無意義）
window.__bench = (n = 8) => {
  const gl = renderer.getContext(); const px = new Uint8Array(4);
  const run = () => { update(5); renderer.info.reset(); composer.render(); gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px); };
  run(); const t0 = performance.now(); for (let i = 0; i < n; i++) run();
  return { ms: (performance.now()-t0)/n, calls: renderer.info.render.calls, tris: renderer.info.render.triangles };
};
</script>
</body>
