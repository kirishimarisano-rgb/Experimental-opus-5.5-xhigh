<!DOCTYPE html>

<script type="importmap">
{
	"imports": {
		"three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
		"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
	}
}

<body>
<canvas id="c"></canvas>
<div id="title" class="overlay hidden"><div class="jp">雨宮駅　春雨</div><div class="sub">AMAMIYA STATION · SPRING RAIN</div></div>
<div id="hint" class="overlay hidden">拖曳：環顧　·　Space：暫停　·　H：隱藏介面<br>畫質：?q=low / med / high</div>
<div id="loading" class="overlay">LOADING</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { CopyShader } from 'three/addons/shaders/CopyShader.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

addEventListener( 'error', ( e ) => { window.__sceneError = String( e.message ); } );

// ============================================================================
// Settings
// ============================================================================
const qs = new URLSearchParams( location.search );
const SHOT = qs.has( 'shot' );                      // deterministic single-frame mode (used for screenshots)
const FIXED_T = qs.has( 't' ) ? parseFloat( qs.get( 't' ) ) : null;
const DEBUG = qs.get( 'debug' ) || '';
const QUALITY = qs.get( 'q' ) || ( matchMedia( '(max-width: 820px)' ).matches ? 'low' : 'high' );
const PRESETS = {
	low: { pr: Math.min( devicePixelRatio, 1 ) * 0.75, msaa: 0, shadow: 1024, fogSteps: 20, lightSamples: 4, rain: 9000, petals: 700, refl: 0.35, ssao: 16 },
	med: { pr: Math.min( devicePixelRatio, 1 ), msaa: 2, shadow: 1536, fogSteps: 28, lightSamples: 6, rain: 16000, petals: 1100, refl: 0.5, ssao: 24 },
	high: { pr: Math.min( devicePixelRatio, 1.5 ), msaa: 4, shadow: 2048, fogSteps: 40, lightSamples: 12, rain: 26000, petals: 1600, refl: 0.5, ssao: 32 }
};
const Q = { ...( PRESETS[ QUALITY ] || PRESETS.high ) };
if ( SHOT ) Q.pr = 1;

// ============================================================================
// Layout (metres, +y up, the line runs along -z)
// ============================================================================
const PLAT = { x0: 0, x1: 5.5, z0: - 52, z1: 30 };          // platform top at y = 0
const GROUND_Y = - 1.45;
const RAIL_TOP = - 1.10;
const TRACK_X = - 1.75;
const GAUGE = 1.067;
const CANOPY = { x0: - 0.35, x1: 5.35, z0: - 24, z1: 2, y: 3.35 };
const CROSS_Z = - 66;
const SUN_DIR = new THREE.Vector3( - 0.36, 0.15, - 0.92 ).normalize();
const FOG = { density: 0.0115, falloff: 0.042, base: GROUND_Y, haze: 0.00075 };

// ============================================================================
// Deterministic randomness & noise
// ============================================================================
function mulberry32( a ) {

	return function () {

		a |= 0; a = a + 0x6D2B79F5 | 0;
		let t = Math.imul( a ^ a >>> 15, 1 | a );
		t = t + Math.imul( t ^ t >>> 7, 61 | t ) ^ t;
		return ( ( t ^ t >>> 14 ) >>> 0 ) / 4294967296;

	};

}

let rng = mulberry32( 20260926 );
const rand = ( a = 0, b = 1 ) => a + ( b - a ) * rng();
const smooth = ( t ) => t * t * ( 3 - 2 * t );
const clamp01 = ( x ) => Math.min( 1, Math.max( 0, x ) );
const smoothstep = ( a, b, x ) => smooth( clamp01( ( x - a ) / ( b - a ) ) );

// tileable 2D value noise; period p (integer lattice cells, <= 256)
function makeNoise2( seed ) {

	const r = mulberry32( seed ), N = 256, g = new Float32Array( N * N );
	for ( let i = 0; i < g.length; i ++ ) g[ i ] = r();
	return ( x, y, p = 256 ) => {

		const xi = Math.floor( x ), yi = Math.floor( y );
		const u = smooth( x - xi ), v = smooth( y - yi );
		const x0 = ( ( xi % p ) + p ) % p, y0 = ( ( yi % p ) + p ) % p, x1 = ( x0 + 1 ) % p, y1 = ( y0 + 1 ) % p;
		const a = g[ y0 * N + x0 ], b = g[ y0 * N + x1 ], c = g[ y1 * N + x0 ], d = g[ y1 * N + x1 ];
		return a + ( b - a ) * u + ( c - a ) * v + ( a - b - c + d ) * u * v;

	};

}

const nA = makeNoise2( 11 ), nB = makeNoise2( 23 ), nC = makeNoise2( 37 );
function fbm( n, x, y, oct = 4, p = 256 ) {

	let s = 0, a = 0.5, f = 1, norm = 0;
	for ( let o = 0; o < oct; o ++ ) {

		s += a * n( x * f, y * f, Math.min( 256, p * f ) ); norm += a; a *= 0.5; f *= 2;

	}

	return s / norm;

}

// ============================================================================
// Renderer
// ============================================================================
const canvas = document.getElementById( 'c' );
const renderer = new THREE.WebGLRenderer( { canvas, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: SHOT, stencil: false } );
renderer.setPixelRatio( Q.pr );
renderer.setSize( innerWidth, innerHeight, false );
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;      // r186: PCF + shadow.radius = soft Vogel-disk filtering
renderer.shadowMap.autoUpdate = false;              // updated once per frame (shared by reflection + main view)
const maxAniso = renderer.capabilities.getMaxAnisotropy();

// ============================================================================
// Atmosphere: exponential height fog + sun-tinted aerial perspective.
// Injected into every built-in material through the fog shader chunks so that
// the main view, the planar reflection and the particles all agree.
// ============================================================================
const f4 = ( x ) => x.toFixed( 5 );
const ATMOS_GLSL = /* glsl */`
#define SUN_DIR normalize(vec3(${f4( SUN_DIR.x )}, ${f4( SUN_DIR.y )}, ${f4( SUN_DIR.z )}))
#define FOG_FALLOFF ${f4( FOG.falloff )}
#define FOG_BASE ${f4( FOG.base )}
#define FOG_HAZE ${f4( FOG.haze )}
vec3 atmosColor( vec3 dir, vec3 base ) {
	float s = max( dot( dir, SUN_DIR ), 0.0 );
	vec3 warm = base * vec3( 1.55, 1.36, 1.12 );
	vec3 c = mix( base, warm, pow( s, 5.0 ) * 0.45 + pow( s, 36.0 ) * 0.7 );
	return c * mix( 0.8, 1.0, smoothstep( -0.25, 0.12, dir.y ) );
}
vec4 atmosphere( vec3 camPos, vec3 ray, vec3 base, float density ) {
	float dist = length( ray );
	vec3 dir = ray / max( dist, 1e-4 );
	float h0 = camPos.y - FOG_BASE;
	float dy = dir.y * dist * FOG_FALLOFF;
	float integ = abs( dy ) > 1e-3 ? ( 1.0 - exp( - dy ) ) / dy : 1.0 - 0.5 * dy;
	float tau = density * dist * exp( - FOG_FALLOFF * max( h0, 0.0 ) ) * integ + FOG_HAZE * dist;
	float T = exp( - tau );
	return vec4( atmosColor( dir, base ) * ( 1.0 - T ), T );
}
`;

THREE.ShaderChunk.fog_pars_vertex = /* glsl */`
#ifdef USE_FOG
	varying vec3 vFogRay;
#endif`;
THREE.ShaderChunk.fog_vertex = /* glsl */`
#ifdef USE_FOG
	vFogRay = transpose( mat3( viewMatrix ) ) * mvPosition.xyz;
#endif`;
THREE.ShaderChunk.fog_pars_fragment = /* glsl */`
#ifdef USE_FOG
	uniform vec3 fogColor;
	varying vec3 vFogRay;
	#ifdef FOG_EXP2
		uniform float fogDensity;
	#else
		uniform float fogNear;
		uniform float fogFar;
	#endif
	${ATMOS_GLSL}
#endif`;
THREE.ShaderChunk.fog_fragment = /* glsl */`
#ifdef USE_FOG
	#ifdef FOG_EXP2
		vec4 atm = atmosphere( cameraPosition, vFogRay, fogColor, fogDensity );
	#else
		vec4 atm = atmosphere( cameraPosition, vFogRay, fogColor, 0.01 );
	#endif
	gl_FragColor.rgb = gl_FragColor.rgb * atm.a + atm.rgb;
#endif`;

// ============================================================================
// Scene, camera
// ============================================================================
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2( new THREE.Color( 0x5f7383 ), FOG.density );
const fxScene = new THREE.Scene();                 // particles, composited after fog with soft depth test

const camera = new THREE.PerspectiveCamera( 42, innerWidth / innerHeight, 0.1, 3000 );
// camera presets: ?cam=main (default) or one of the close-up views used to inspect modelling detail
const CAMS = {
	main: [ [ 2.35, 1.42, 14.5 ], [ - 0.9, 1.75, - 40 ] ],
	station: [ [ 1.3, 1.55, 6.2 ], [ 4.7, 1.2, - 2.5 ] ],
	roof: [ [ 1.0, 1.5, 0.5 ], [ 3.2, 3.3, - 8 ] ],
	houses: [ [ 0.6, 1.7, - 4 ], [ - 24, 3.2, - 30 ] ],
	track: [ [ - 0.6, - 0.35, 9 ], [ - 2.2, - 0.9, - 12 ] ]
};
const CAM_SEL = CAMS[ qs.get( 'cam' ) ] || CAMS.main;
const CAM_BASE = { pos: new THREE.Vector3( ...CAM_SEL[ 0 ] ), target: new THREE.Vector3( ...CAM_SEL[ 1 ] ) };
camera.position.copy( CAM_BASE.pos );
camera.lookAt( CAM_BASE.target );

const U = {
	time: { value: 0 },
	fogColor: { value: scene.fog.color },
	fogDensity: { value: FOG.density }
};

// ============================================================================
// Texture helpers
// ============================================================================
function canvas2d( w, h ) {

	const c = document.createElement( 'canvas' );
	c.width = w; c.height = h;
	return { c, g: c.getContext( '2d', { willReadFrequently: true } ) };

}

function toTex( c, { srgb = true, rx = 1, ry = 1 } = {} ) {

	const t = new THREE.CanvasTexture( c );
	t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
	t.wrapS = t.wrapT = THREE.RepeatWrapping;
	t.repeat.set( rx, ry );
	t.anisotropy = maxAniso;
	return t;

}

function heightFromCanvas( c ) {

	const { width: w, height: h } = c;
	const d = c.getContext( '2d' ).getImageData( 0, 0, w, h ).data;
	const out = new Float32Array( w * h );
	for ( let i = 0; i < out.length; i ++ ) out[ i ] = d[ i * 4 ] / 255;
	return out;

}

// height (row 0 = top) -> tangent-space normal map (canvas, flipY'd like the colour maps)
function normalCanvas( hgt, w, h, strength ) {

	const { c, g } = canvas2d( w, h );
	const img = g.createImageData( w, h ), d = img.data;
	for ( let y = 0; y < h; y ++ ) {

		const yu = ( y - 1 + h ) % h, yd = ( y + 1 ) % h;
		for ( let x = 0; x < w; x ++ ) {

			const xl = ( x - 1 + w ) % w, xr = ( x + 1 ) % w;
			const dx = ( hgt[ y * w + xr ] - hgt[ y * w + xl ] ) * strength;
			const dy = ( hgt[ yd * w + x ] - hgt[ yu * w + x ] ) * strength;
			const l = Math.hypot( dx, dy, 1 ), i = ( y * w + x ) * 4;
			d[ i ] = ( - dx / l * 0.5 + 0.5 ) * 255;
			d[ i + 1 ] = ( dy / l * 0.5 + 0.5 ) * 255;
			d[ i + 2 ] = ( 1 / l * 0.5 + 0.5 ) * 255;
			d[ i + 3 ] = 255;

		}

	}

	g.putImageData( img, 0, 0 );
	return c;

}

const JP_FONT = '"Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", "IPAGothic", sans-serif';

// ---------------------------------------------------------------------------
// Asphalt tile (512², ~2.75 m) – colour + height, tileable
// ---------------------------------------------------------------------------
function asphaltTile( N = 512, seed = 5 ) {

	const r = mulberry32( seed );
	const col = canvas2d( N, N ), hgt = canvas2d( N, N );
	const ci = col.g.createImageData( N, N ), hi = hgt.g.createImageData( N, N );
	for ( let y = 0; y < N; y ++ ) for ( let x = 0; x < N; x ++ ) {

		const u = x / N, v = y / N;
		const n1 = fbm( nA, u * 6, v * 6, 4, 6 );
		const n2 = nB( u * 96, v * 96, 96 );
		const sp = r();
		let g = 0.30 + ( n1 - 0.5 ) * 0.16 + ( n2 - 0.5 ) * 0.07;
		let h = 0.45 + ( n2 - 0.5 ) * 0.5;
		if ( sp > 0.935 ) { g += 0.16 * ( sp - 0.935 ) / 0.065; h += 0.3; }
		if ( sp < 0.05 ) { g -= 0.07; h -= 0.25; }
		const i = ( y * N + x ) * 4;
		ci.data[ i ] = g * 238; ci.data[ i + 1 ] = g * 244; ci.data[ i + 2 ] = g * 250; ci.data[ i + 3 ] = 255;
		hi.data[ i ] = hi.data[ i + 1 ] = hi.data[ i + 2 ] = clamp01( h ) * 255; hi.data[ i + 3 ] = 255;

	}

	col.g.putImageData( ci, 0, 0 ); hgt.g.putImageData( hi, 0, 0 );
	return { col: col.c, hgt: hgt.c };

}

// ---------------------------------------------------------------------------
// Platform surface: coping stones, tactile paving (点字ブロック), asphalt.
// Canvas spans x ∈ [0, 5.5] m (u) and 10 m along the platform (v).
// ---------------------------------------------------------------------------
function platformTextures() {

	const W = 1024, H = 2048, pxU = W / 5.5, pxV = H / 10;
	const tile = asphaltTile();
	const col = canvas2d( W, H ), hgt = canvas2d( W, H ), rgh = canvas2d( W, H );
	for ( let y = 0; y < H; y += 512 ) for ( let x = 0; x < W; x += 512 ) {

		col.g.drawImage( tile.col, x, y ); hgt.g.drawImage( tile.hgt, x, y );

	}

	rgh.g.fillStyle = 'rgb(165,165,165)'; rgh.g.fillRect( 0, 0, W, H );
	const r = mulberry32( 77 );

	// asphalt repair patches & cracks
	for ( let i = 0; i < 7; i ++ ) {

		const x = ( 1.4 + r() * 3.6 ) * pxU, y = r() * H, w = ( 0.4 + r() * 1.2 ) * pxU, h = ( 0.4 + r() * 1.6 ) * pxV;
		col.g.fillStyle = r() > 0.5 ? 'rgba(20,22,24,0.35)' : 'rgba(120,124,128,0.18)';
		col.g.fillRect( x, y, w, h );
		rgh.g.fillStyle = 'rgba(120,120,120,0.6)'; rgh.g.fillRect( x, y, w, h );

	}

	col.g.lineCap = hgt.g.lineCap = 'round';
	for ( let i = 0; i < 26; i ++ ) {

		let x = ( 1.3 + r() * 4.1 ) * pxU, y = r() * H;
		col.g.beginPath(); hgt.g.beginPath(); col.g.moveTo( x, y ); hgt.g.moveTo( x, y );
		const seg = 4 + r() * 10;
		for ( let s = 0; s < seg; s ++ ) {

			x += ( r() - 0.5 ) * 40; y += ( r() - 0.3 ) * 50;
			col.g.lineTo( x, y ); hgt.g.lineTo( x, y );

		}

		col.g.strokeStyle = 'rgba(8,9,10,0.55)'; col.g.lineWidth = 1.2 + r() * 1.5; col.g.stroke();
		hgt.g.strokeStyle = 'rgba(0,0,0,0.8)'; hgt.g.lineWidth = 2; hgt.g.stroke();

	}

	// coping stones along the platform edge (0 – 0.45 m)
	const copeW = 0.45 * pxU;
	for ( let y = 0; y < H; y += 0.9 * pxV ) {

		const t = 150 + r() * 22;
		col.g.fillStyle = `rgb(${t},${t + 3},${t + 2})`;
		col.g.fillRect( 0, y, copeW, 0.9 * pxV );
		hgt.g.fillStyle = 'rgb(150,150,150)'; hgt.g.fillRect( 0, y, copeW, 0.9 * pxV );
		rgh.g.fillStyle = 'rgb(140,140,140)'; rgh.g.fillRect( 0, y, copeW, 0.9 * pxV );
		col.g.fillStyle = 'rgba(40,42,44,0.9)'; col.g.fillRect( 0, y, copeW, 2 );
		hgt.g.fillStyle = 'rgb(60,60,60)'; hgt.g.fillRect( 0, y, copeW, 3 );

	}

	// speckle the stones
	const ci = col.g.getImageData( 0, 0, Math.ceil( copeW ), H );
	for ( let i = 0; i < ci.data.length; i += 4 ) {

		const k = ( r() - 0.5 ) * 26;
		ci.data[ i ] += k; ci.data[ i + 1 ] += k; ci.data[ i + 2 ] += k;

	}

	col.g.putImageData( ci, 0, 0 );
	col.g.fillStyle = 'rgba(30,32,34,0.9)'; col.g.fillRect( 0, 0, 5, H );                // rounded nose
	col.g.fillStyle = 'rgba(235,235,225,0.85)'; col.g.fillRect( copeW - 0.06 * pxU, 0, 0.05 * pxU, H ); // white line

	// tactile warning blocks 0.80 – 1.10 m with 5x5 domes, plus the inner guide bar
	const tx0 = 0.80 * pxU, tw = 0.30 * pxU, bh = 0.30 * pxV;
	for ( let y = 0; y < H; y += bh ) {

		const k = r() * 14;
		col.g.fillStyle = `rgb(${214 + k},${170 + k},${34})`; col.g.fillRect( tx0, y, tw, bh );
		hgt.g.fillStyle = 'rgb(165,165,165)'; hgt.g.fillRect( tx0, y, tw, bh );
		rgh.g.fillStyle = 'rgb(110,110,110)'; rgh.g.fillRect( tx0, y, tw, bh );
		col.g.fillStyle = 'rgba(90,70,10,0.8)'; col.g.fillRect( tx0, y, tw, 1.5 );
		for ( let j = 0; j < 5; j ++ ) for ( let i = 0; i < 5; i ++ ) {

			const cx = tx0 + ( i + 0.5 ) * tw / 5, cy = y + ( j + 0.5 ) * bh / 5;
			const gr = hgt.g.createRadialGradient( cx, cy, 0, cx, cy, 5 );
			gr.addColorStop( 0, 'rgb(255,255,255)' ); gr.addColorStop( 1, 'rgb(165,165,165)' );
			hgt.g.fillStyle = gr; hgt.g.beginPath(); hgt.g.arc( cx, cy, 5, 0, Math.PI * 2 ); hgt.g.fill();
			col.g.fillStyle = 'rgba(255,230,120,0.35)'; col.g.beginPath(); col.g.arc( cx - 1, cy - 1, 2.2, 0, Math.PI * 2 ); col.g.fill();

		}

	}

	const bx = 1.12 * pxU, bw = 0.05 * pxU;
	col.g.fillStyle = 'rgb(222,178,36)'; col.g.fillRect( bx, 0, bw, H );
	hgt.g.fillStyle = 'rgb(235,235,235)'; hgt.g.fillRect( bx + 2, 0, bw - 4, H );
	rgh.g.fillStyle = 'rgb(110,110,110)'; rgh.g.fillRect( bx, 0, bw, H );

	// boarding position mark (乗車位置) painted near the edge
	col.g.fillStyle = 'rgba(230,232,225,0.7)';
	for ( const yy of [ 0.18 * H, 0.68 * H ] ) {

		col.g.beginPath(); col.g.moveTo( 0.5 * pxU, yy ); col.g.lineTo( 0.74 * pxU, yy - 0.12 * pxV ); col.g.lineTo( 0.74 * pxU, yy + 0.12 * pxV ); col.g.fill();

	}

	const h = heightFromCanvas( hgt.c );
	return {
		map: toTex( col.c, { ry: ( PLAT.z1 - PLAT.z0 ) / 10 } ),
		normalMap: toTex( normalCanvas( h, W, H, 3.0 ), { srgb: false, ry: ( PLAT.z1 - PLAT.z0 ) / 10 } ),
		roughnessMap: toTex( rgh.c, { srgb: false, ry: ( PLAT.z1 - PLAT.z0 ) / 10 } )
	};

}

// generic tileable surfaces --------------------------------------------------
function concreteTextures( seed = 3, base = [ 150, 152, 150 ], streaks = true ) {

	const N = 512, col = canvas2d( N, N ), img = col.g.createImageData( N, N ), h = new Float32Array( N * N );
	const r = mulberry32( seed );
	for ( let y = 0; y < N; y ++ ) for ( let x = 0; x < N; x ++ ) {

		const u = x / N, v = y / N;
		const n = fbm( nC, u * 4, v * 4, 5, 4 );
		const s = streaks ? fbm( nA, u * 24, v * 2, 3, 24 ) : 0.5;
		const pit = r() > 0.992 ? - 0.25 : 0;
		const k = 0.82 + ( n - 0.5 ) * 0.35 - ( s - 0.5 ) * 0.22 + pit * 0.5 + ( r() - 0.5 ) * 0.05;
		const i = ( y * N + x ) * 4;
		img.data[ i ] = base[ 0 ] * k; img.data[ i + 1 ] = base[ 1 ] * k; img.data[ i + 2 ] = base[ 2 ] * k; img.data[ i + 3 ] = 255;
		h[ y * N + x ] = n * 0.6 + pit + r() * 0.08;

	}

	col.g.putImageData( img, 0, 0 );
	return { map: toTex( col.c ), normalMap: toTex( normalCanvas( h, N, N, 2.0 ), { srgb: false } ) };

}

function gravelTextures() {

	const N = 512, G = 26, r = mulberry32( 9 );
	const pts = [];
	for ( let j = 0; j < G; j ++ ) for ( let i = 0; i < G; i ++ ) pts.push( [ ( i + 0.15 + r() * 0.7 ) / G, ( j + 0.15 + r() * 0.7 ) / G, r() ] );
	const col = canvas2d( N, N ), img = col.g.createImageData( N, N ), h = new Float32Array( N * N );

		const u = x / N, v = y / N, ci = Math.floor( u * G ), cj = Math.floor( v * G );
		let f1 = 9, f2 = 9, id = 0;
		for ( let dj = - 1; dj <= 1; dj ++ ) for ( let di = - 1; di <= 1; di ++ ) {

// sakura blossom clusters, 2x2 atlas ------------------------------------------
function blossomAtlas() {

	const S = 512, { c, g } = canvas2d( S, S ), r = mulberry32( 404 );
	const flower = ( x, y, rad, rot, tint ) => {

		for ( let k = 0; k < 5; k ++ ) {

			const a = rot + k * Math.PI * 2 / 5;
			g.save(); g.translate( x, y ); g.rotate( a );
			const gr = g.createLinearGradient( 0, 0, 0, - rad );
			gr.addColorStop( 0, `rgba(255,${226 - tint * 40},${234 - tint * 30},1)` );
			gr.addColorStop( 1, `rgba(${250 - tint * 10},${196 - tint * 60},${212 - tint * 50},1)` );
			g.fillStyle = gr;
			g.beginPath();
			g.ellipse( 0, - rad * 0.55, rad * 0.36, rad * 0.55, 0, 0, Math.PI * 2 );
			g.fill();
			g.globalCompositeOperation = 'destination-out';
			g.beginPath(); g.moveTo( - rad * 0.08, - rad * 1.12 ); g.lineTo( 0, - rad * 0.92 ); g.lineTo( rad * 0.08, - rad * 1.12 ); g.fill();
			g.globalCompositeOperation = 'source-over';
			g.restore();

		}

		g.fillStyle = `rgba(${200 - tint * 30},${70},${100},0.9)`;
		g.beginPath(); g.arc( x, y, rad * 0.16, 0, Math.PI * 2 ); g.fill();
		g.fillStyle = 'rgba(250,215,120,0.9)';
		for ( let k = 0; k < 7; k ++ ) {

			const a = r() * 6.28, d = rad * ( 0.2 + r() * 0.12 );
			g.fillRect( x + Math.cos( a ) * d, y + Math.sin( a ) * d, 1.4, 1.4 );

		}

	};

	for ( let q = 0; q < 4; q ++ ) {

		const ox = ( q % 2 ) * 256, oy = Math.floor( q / 2 ) * 256, cx = ox + 128, cy = oy + 132;
		g.save();
		g.beginPath(); g.rect( ox, oy, 256, 256 ); g.clip();
		// clump silhouette: overlapping lobes, lighter on top, slightly deeper pink underneath
		const lobes = [];
		for ( let i = 0; i < 9; i ++ ) {

			const a = r() * 6.28, d = Math.sqrt( r() ) * 62;
			lobes.push( [ cx + Math.cos( a ) * d, cy + Math.sin( a ) * d * 0.75, 30 + r() * 20 ] );

		}

		for ( const [ x, y, rad ] of lobes ) {

			const gr = g.createLinearGradient( 0, y - rad, 0, y + rad );
			gr.addColorStop( 0, '#fbe3ea' ); gr.addColorStop( 1, q === 3 ? '#e7a5bb' : '#eebccb' );
			g.fillStyle = gr;
			g.beginPath(); g.arc( x, y, rad, 0, 6.28 ); g.fill();

		}

		// a few young leaves peeking out
		for ( let i = 0; i < 5; i ++ ) {

			const [ x, y, rad ] = lobes[ Math.floor( r() * lobes.length ) ];
			const a = r() * 6.28;
			g.fillStyle = r() > 0.5 ? 'rgba(110,126,62,1)' : 'rgba(138,90,70,1)';
			g.beginPath(); g.ellipse( x + Math.cos( a ) * rad, y + Math.sin( a ) * rad, 4, 10, a, 0, 6.28 ); g.fill();

		}

		// flowers: dense inside, and along the rim so the edge reads as petals, not a disc
		for ( let i = 0; i < 150; i ++ ) {

			const [ x, y, rad ] = lobes[ Math.floor( r() * lobes.length ) ];
			const a = r() * 6.28, d = ( i < 60 ? 0.85 + r() * 0.2 : Math.sqrt( r() ) * 0.9 ) * rad;
			flower( x + Math.cos( a ) * d, y + Math.sin( a ) * d, 6 + r() * 4, r() * 6.28, r() * ( q === 3 ? 0.8 : 0.4 ) );

		}

		for ( let i = 0; i < 10; i ++ ) {

			const [ x, y, rad ] = lobes[ Math.floor( r() * lobes.length ) ];
			const a = r() * 6.28, d = r() * rad;
			g.fillStyle = 'rgba(222,112,150,1)';
			g.beginPath(); g.ellipse( x + Math.cos( a ) * d, y + Math.sin( a ) * d, 2.5, 4, a, 0, 6.28 ); g.fill();

		}

		// airy gaps inside the clump
		g.globalCompositeOperation = 'destination-out';
		for ( let i = 0; i < 7; i ++ ) {

			const [ x, y, rad ] = lobes[ Math.floor( r() * lobes.length ) ];
			const a = r() * 6.28, d = rad * ( 0.3 + r() * 0.5 );
			g.beginPath(); g.arc( x + Math.cos( a ) * d, y + Math.sin( a ) * d, 3 + r() * 5, 0, 6.28 ); g.fill();

		}

		g.globalCompositeOperation = 'source-over';
		g.restore();

	}

	const t = toTex( c );
	t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
	return t;

}

function kawaraTextures() {

// tileable 3D value-noise fbm for the volumetric fog
function noise3DTexture( S = 64 ) {

	const L = 32, r = mulberry32( 606 ), G = new Float32Array( L * L * L );
	for ( let i = 0; i < G.length; i ++ ) G[ i ] = r();
	const vn = ( x, y, z, p ) => {

		const xi = Math.floor( x ), yi = Math.floor( y ), zi = Math.floor( z );
		const u = smooth( x - xi ), v = smooth( y - yi ), w = smooth( z - zi );
		const X0 = xi % p, Y0 = yi % p, Z0 = zi % p, X1 = ( X0 + 1 ) % p, Y1 = ( Y0 + 1 ) % p, Z1 = ( Z0 + 1 ) % p;
		const at = ( a, b, c ) => G[ ( c * L + b ) * L + a ];
		const x00 = at( X0, Y0, Z0 ) + ( at( X1, Y0, Z0 ) - at( X0, Y0, Z0 ) ) * u;
		const x10 = at( X0, Y1, Z0 ) + ( at( X1, Y1, Z0 ) - at( X0, Y1, Z0 ) ) * u;
		const x01 = at( X0, Y0, Z1 ) + ( at( X1, Y0, Z1 ) - at( X0, Y0, Z1 ) ) * u;
		const x11 = at( X0, Y1, Z1 ) + ( at( X1, Y1, Z1 ) - at( X0, Y1, Z1 ) ) * u;
		const y0 = x00 + ( x10 - x00 ) * v, y1 = x01 + ( x11 - x01 ) * v;
		return y0 + ( y1 - y0 ) * w;

	};

	const data = new Uint8Array( S * S * S );
	for ( let z = 0; z < S; z ++ ) for ( let y = 0; y < S; y ++ ) for ( let x = 0; x < S; x ++ ) {

		const f = 8 / S;
		const v = vn( x * f, y * f, z * f, 8 ) * 0.55 + vn( x * f * 2, y * f * 2, z * f * 2, 16 ) * 0.3 + vn( x * f * 4, y * f * 4, z * f * 4, 32 ) * 0.15;
		data[ ( z * S + y ) * S + x ] = v * 255;

	}

	const t = new THREE.Data3DTexture( data, S, S, S );
	t.format = THREE.RedFormat; t.type = THREE.UnsignedByteType;
	t.minFilter = t.magFilter = THREE.LinearFilter;
	t.wrapS = t.wrapT = t.wrapR = THREE.RepeatWrapping;
	t.unpackAlignment = 1;
	t.needsUpdate = true;
	return t;

}

const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _s = new THREE.Vector3();

function worldUV( g, s ) {

	const p = g.attributes.position, n = g.attributes.normal, uv = g.attributes.uv;
	for ( let i = 0; i < p.count; i ++ ) {

		const nx = Math.abs( n.getX( i ) ), ny = Math.abs( n.getY( i ) ), nz = Math.abs( n.getZ( i ) );
		let u, v;
		if ( nx >= ny && nx >= nz ) { u = p.getZ( i ); v = p.getY( i ); } else if ( ny >= nz ) { u = p.getX( i ); v = p.getZ( i ); } else { u = p.getX( i ); v = p.getY( i ); }
		uv.setXY( i, u / s, v / s );

	}

}

// merges static geometry per material to keep the draw-call count low
class Batch {

	constructor() { this.groups = new Map(); }
	add( geo, mat, { x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1, uv = 0 } = {} ) {

		const g = geo.index ? geo.toNonIndexed() : geo.clone();
		_m4.compose( _v.set( x, y, z ), _q.setFromEuler( _e.set( rx, ry, rz ) ), _s.set( sx, sy, sz ) );
		g.applyMatrix4( _m4 );
		if ( uv ) worldUV( g, uv );
		for ( const k of Object.keys( g.attributes ) ) if ( ! [ 'position', 'normal', 'uv' ].includes( k ) ) g.deleteAttribute( k );
		g.clearGroups();
		if ( ! this.groups.has( mat ) ) this.groups.set( mat, [] );
		this.groups.get( mat ).push( g );
		return g;

	}
	box( w, h, d, mat, o ) { return this.add( new THREE.BoxGeometry( w, h, d ), mat, o ); }
	cyl( r0, r1, h, mat, o, seg = 10 ) { return this.add( new THREE.CylinderGeometry( r0, r1, h, seg ), mat, o ); }
	// a cylinder spanning two points
	rod( a, b, r, mat, seg = 6 ) {

		const d = new THREE.Vector3().subVectors( b, a ), len = d.length();
		const g = new THREE.CylinderGeometry( r, r, len, seg, 1, true ).toNonIndexed();
		g.applyQuaternion( new THREE.Quaternion().setFromUnitVectors( new THREE.Vector3( 0, 1, 0 ), d.normalize() ) );
		g.translate( ( a.x + b.x ) / 2, ( a.y + b.y ) / 2, ( a.z + b.z ) / 2 );
		return this.add( g, mat );

	}
	flush( parent, { cast = true, receive = true, noAO = false, name = '' } = {} ) {

		const out = [];
		for ( const [ mat, list ] of this.groups ) {

			const m = new THREE.Mesh( mergeGeometries( list, false ), mat );
			m.castShadow = cast; m.receiveShadow = receive; m.name = name;
			if ( noAO ) m.userData.noAO = true;
			parent.add( m ); out.push( m );

		}

		this.groups.clear();
		return out;

	}

}

// tube with radius tapering from r0 to r1 along a polyline (parallel-transport frames)
function taperTube( pts, r0, r1, radial = 6 ) {

	const n = pts.length, pos = [], nrm = [], uv = [], idx = [];
	const T = [], N = [], B = [];
	for ( let i = 0; i < n; i ++ ) {

		const a = pts[ Math.max( 0, i - 1 ) ], b = pts[ Math.min( n - 1, i + 1 ) ];
		T.push( new THREE.Vector3().subVectors( b, a ).normalize() );

	}

	let nn = Math.abs( T[ 0 ].y ) < 0.9 ? new THREE.Vector3( 0, 1, 0 ) : new THREE.Vector3( 1, 0, 0 );
	nn = nn.sub( T[ 0 ].clone().multiplyScalar( nn.dot( T[ 0 ] ) ) ).normalize();
	let len = 0;
	for ( let i = 0; i < n; i ++ ) {

		if ( i > 0 ) {

			nn = nn.sub( T[ i ].clone().multiplyScalar( nn.dot( T[ i ] ) ) ).normalize();
			len += pts[ i ].distanceTo( pts[ i - 1 ] );

		}

		N.push( nn.clone() ); B.push( new THREE.Vector3().crossVectors( T[ i ], nn ) );
		const r = r0 + ( r1 - r0 ) * ( i / ( n - 1 ) );
		for ( let j = 0; j <= radial; j ++ ) {

			const a = j / radial * Math.PI * 2, ca = Math.cos( a ), sa = Math.sin( a );
			const dx = N[ i ].x * ca + B[ i ].x * sa, dy = N[ i ].y * ca + B[ i ].y * sa, dz = N[ i ].z * ca + B[ i ].z * sa;
			pos.push( pts[ i ].x + dx * r, pts[ i ].y + dy * r, pts[ i ].z + dz * r );
			nrm.push( dx, dy, dz );
			uv.push( j / radial, len * 0.8 );

		}

	}

	for ( let i = 0; i < n - 1; i ++ ) for ( let j = 0; j < radial; j ++ ) {

		const a = i * ( radial + 1 ) + j, b = a + radial + 1;
		idx.push( a, b, a + 1, b, b + 1, a + 1 );

	}

	const g = new THREE.BufferGeometry();
	g.setAttribute( 'position', new THREE.Float32BufferAttribute( pos, 3 ) );
	g.setAttribute( 'normal', new THREE.Float32BufferAttribute( nrm, 3 ) );
	g.setAttribute( 'uv', new THREE.Float32BufferAttribute( uv, 2 ) );
	g.setIndex( idx );
	return g;

}

// pseudo-3D value noise from the tileable 2D tables (good enough for vertex jitter)
const n3 = ( x, y, z ) => ( nA( x + z * 0.71, y ) + nB( z + y * 0.53, x ) + nC( y + x * 0.37, z ) ) / 3;

// leafy clump: several overlapping noise-displaced spheres, smooth normals, baked self-shadowing
// (darker underneath and towards the core) in vertex colours
function lumpyGeometry( seed, { lumps = 5, spread = 0.5, detail = 2, bump = 0.22, freq = 3.2, flatten = 0.8 } = {} ) {

	const r = mulberry32( seed ), parts = [];
	for ( let i = 0; i < lumps; i ++ ) {

		const g = mergeVertices( new THREE.IcosahedronGeometry( 1, detail ).deleteAttribute( 'normal' ).deleteAttribute( 'uv' ) );
		const rad = i === 0 ? 0.75 : 0.42 + r() * 0.3;
		const c = i === 0 ? new THREE.Vector3( 0, 0, 0 ) : new THREE.Vector3( r() - 0.5, ( r() - 0.3 ) * 0.7, r() - 0.5 ).normalize().multiplyScalar( spread * ( 0.6 + r() * 0.4 ) );
		const pos = g.attributes.position, o = r() * 50;
		for ( let k = 0; k < pos.count; k ++ ) {

			_v.fromBufferAttribute( pos, k );
			const d = 1 + ( n3( _v.x * freq + o, _v.y * freq, _v.z * freq ) - 0.5 ) * 2 * bump + ( n3( _v.x * freq * 3 + o, _v.y * freq * 3, _v.z * freq * 3 ) - 0.5 ) * bump * 0.8;
			_v.multiplyScalar( rad * d ).add( c );
			pos.setXYZ( k, _v.x, _v.y * flatten, _v.z );

		}

		parts.push( g );

	}

	const g = mergeGeometries( parts );
	g.computeVertexNormals();
	const pos = g.attributes.position, col = new Float32Array( pos.count * 3 );
	for ( let k = 0; k < pos.count; k ++ ) {

		_v.fromBufferAttribute( pos, k );
		const ao = ( 0.45 + 0.55 * smoothstep( - 0.7, 0.7, _v.y ) ) * ( 0.7 + 0.3 * clamp01( _v.length() / 1.1 ) );
		col.set( [ ao, ao, ao ], k * 3 );

	}

	g.setAttribute( 'color', new THREE.BufferAttribute( col, 3 ) );
	return g;

}

// Japanese cedar (杉): trunk plus overlapping, ragged conical tiers (unit height, unit base radius)
function cedarGeometry( seed ) {

	const r = mulberry32( seed ), parts = [];
	const trunk = new THREE.CylinderGeometry( 0.05, 0.08, 0.25, 6 ).translate( 0, 0.125, 0 );
	parts.push( trunk );
	const tiers = 4;
	for ( let i = 0; i < tiers; i ++ ) {

		const t = i / tiers, rad = 1 - t * 0.78, h = 0.42 - t * 0.12, y0 = 0.12 + t * 0.78;
		const g = new THREE.ConeGeometry( rad, h, 8, 2, true ).translate( 0, y0 + h / 2, 0 );
		const pos = g.attributes.position, o = r() * 40;
		for ( let k = 0; k < pos.count; k ++ ) {

			_v.fromBufferAttribute( pos, k );
			const a = Math.atan2( _v.z, _v.x );
			const j = 1 + ( n3( Math.cos( a ) * 2 + o, _v.y * 6, Math.sin( a ) * 2 ) - 0.5 ) * 0.7;
			pos.setXYZ( k, _v.x * j, _v.y - ( Math.hypot( _v.x, _v.z ) > rad * 0.7 ? 0.04 * j : 0 ), _v.z * j );

		}

		parts.push( g );

	}

	const g = mergeGeometries( parts.map( ( p ) => p.toNonIndexed().deleteAttribute( 'uv' ) ) );
	g.computeVertexNormals();
	const pos = g.attributes.position, col = new Float32Array( pos.count * 3 );
	for ( let k = 0; k < pos.count; k ++ ) {

		const y = pos.getY( k );
		const trunkPart = k < trunk.toNonIndexed().attributes.position.count;
		if ( trunkPart ) col.set( [ 0.55, 0.38, 0.3 ], k * 3 );
		else { const ao = 0.55 + 0.45 * ( ( y * 5 ) % 1 ); col.set( [ ao, ao, ao ], k * 3 ); }

	}

	g.setAttribute( 'color', new THREE.BufferAttribute( col, 3 ) );
	return g;

}

// grass tuft: two crossed cards with up-facing normals (lit like the ground, not like paper)
function tuftGeometry() {

	const parts = [ 0, Math.PI / 2 ].map( ( a ) => new THREE.PlaneGeometry( 1, 1 ).translate( 0, 0.5, 0 ).rotateY( a ).toNonIndexed() );
	const g = mergeGeometries( parts );
	const nrm = g.attributes.normal;
	for ( let i = 0; i < nrm.count; i ++ ) nrm.setXYZ( i, 0, 1, 0 );
	return g;

}

// sagging cable between two points (parabolic approximation of a catenary)
function sagPoints( a, b, sag, seg = 12 ) {

	const out = [];
	for ( let i = 0; i <= seg; i ++ ) {

		const t = i / seg;
		const p = new THREE.Vector3().lerpVectors( a, b, t );
		p.y -= sag * 4 * t * ( 1 - t );
		out.push( p );

	}

	return out;

}

// Wet surfaces with planar reflections.
// Two mirror planes: the platform top (y = 0) and the ground / road level.
// ============================================================================
function makeReflector( y ) {

	const rt = new THREE.WebGLRenderTarget( 1, 1, { type: THREE.HalfFloatType } );
	rt.texture.generateMipmaps = true;
	rt.texture.minFilter = THREE.LinearMipmapLinearFilter;
	return { y, rt, matrix: new THREE.Matrix4(), cam: new THREE.PerspectiveCamera(), hide: [] };

}

const REFL = { platform: makeReflector( 0 ), ground: makeReflector( GROUND_Y + 0.04 ) };

const WET_SHARED = {
	tPuddle: { value: TX.puddle },
	uTime: U.time,
	uCanopy: { value: new THREE.Vector4( CANOPY.x0, CANOPY.x1, CANOPY.z0, CANOPY.z1 ) }
};

const WET_PARS = /* glsl */`
uniform sampler2D tReflect;
uniform sampler2D tPuddle;
uniform float uTime;
uniform vec4 uCanopy;
uniform vec4 uWet;          // x: wetness, y: puddle threshold, z: reflection strength, w: puddle scale
varying vec4 vReflCoord;
varying vec3 vWPos;
vec2 hash22( vec2 p ) {
	vec3 p3 = fract( vec3( p.xyx ) * vec3( 0.1031, 0.1030, 0.0973 ) );
	p3 += dot( p3, p3.yzx + 33.33 );
	return fract( ( p3.xx + p3.yz ) * p3.zy );
}
// expanding rain-drop rings -> 2D normal perturbation
vec2 ripples( vec2 uv, float t ) {
	vec2 p0 = floor( uv );
	vec2 acc = vec2( 0.0 );
	for ( int j = -1; j <= 1; j ++ ) for ( int i = -1; i <= 1; i ++ ) {
		vec2 pi = p0 + vec2( i, j );
		vec2 h = hash22( pi );
		float period = 0.75 + h.y * 0.6;
		float cyc = t / period + h.x * 7.0;
		float n = floor( cyc );
		float tt = fract( cyc );
		vec2 p = pi + hash22( pi + n * 17.13 );
		vec2 v = p - uv;
		float d = length( v ) - 1.6 * tt;
		float w = sin( 26.0 * d ) * smoothstep( -0.55, -0.25, d ) * smoothstep( 0.0, -0.25, d );
		float dw = 26.0 * cos( 26.0 * d ) * smoothstep( -0.55, -0.25, d ) * smoothstep( 0.0, -0.25, d );
		acc += normalize( v + 1e-4 ) * dw * ( 1.0 - tt ) * ( 1.0 - tt );
	}
	return acc / 9.0;
}
float canopyDry( vec3 p ) {
	vec2 dmin = p.xz - uCanopy.xz;
	vec2 dmax = uCanopy.yw - p.xz;
	float inside = min( min( dmin.x, dmax.x ), min( dmin.y, dmax.y ) );
	return smoothstep( 0.2, 1.2, inside );
}
`;

function makeWetMaterial( base, { refl, wet = 1, puddle = 0.5, strength = 1, puddleScale = 1, defines = {} } ) {

	const m = std( base );
	m.defines = { ...defines };
	m.customProgramCacheKey = () => 'wet' + Object.keys( m.defines ).join( ',' );
	const uniforms = {
		...WET_SHARED,
		tReflect: { value: refl.rt.texture },
		reflMatrix: { value: refl.matrix },
		uWet: { value: new THREE.Vector4( wet, puddle, strength, puddleScale ) }
	};
	m.userData.wetUniforms = uniforms;
	m.onBeforeCompile = ( sh ) => {

		Object.assign( sh.uniforms, uniforms );
		sh.vertexShader = sh.vertexShader
			.replace( '#include <common>', '#include <common>\nuniform mat4 reflMatrix;\nvarying vec4 vReflCoord;\nvarying vec3 vWPos;' )
			.replace( '#include <worldpos_vertex>', `#include <worldpos_vertex>
				vec4 wp4 = modelMatrix * vec4( transformed, 1.0 );
				vWPos = wp4.xyz;
				vReflCoord = reflMatrix * wp4;` );
		sh.fragmentShader = sh.fragmentShader
			.replace( '#include <common>', '#include <common>\n' + WET_PARS )
			.replace( '#include <map_fragment>', `#include <map_fragment>
				float dry = canopyDry( vWPos );
				float wet = ( 1.0 - dry * 0.8 ) * uWet.x;
				vec2 pxz = vWPos.xz * uWet.w;
				float pn = texture2D( tPuddle, pxz * 0.045 ).r * 0.7 + texture2D( tPuddle, pxz * 0.19 + 0.37 ).r * 0.3;
				float puddle = smoothstep( uWet.y, uWet.y + 0.08, pn ) * ( 1.0 - dry );
				#ifdef PLATFORM_EDGE
					puddle *= smoothstep( 1.25, 1.6, vWPos.x );
				#endif
				diffuseColor.rgb *= mix( 1.0, 0.58, wet );
				diffuseColor.rgb *= mix( 1.0, 0.55, puddle );` )
			.replace( '#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
				roughnessFactor = mix( roughnessFactor, roughnessFactor * 0.55, wet );
				roughnessFactor = mix( roughnessFactor, 0.035, puddle );` )
			.replace( '#include <normal_fragment_maps>', `#include <normal_fragment_maps>
				vec2 rip = ( ripples( vWPos.xz * 7.0, uTime ) + ripples( vWPos.xz * 5.3 + 17.0, uTime * 1.13 ) ) * ( 1.0 - dry );
				vec3 ripW = vec3( rip.x, 0.0, rip.y ) * mix( 0.02, 0.09, puddle );
				normal = normalize( mix( normal, ( viewMatrix * vec4( 0.0, 1.0, 0.0, 0.0 ) ).xyz, puddle * 0.85 ) + ( viewMatrix * vec4( ripW, 0.0 ) ).xyz );` )
			.replace( '#include <opaque_fragment>', `
				{
					vec3 nW = normalize( ( vec4( normal, 0.0 ) * viewMatrix ).xyz );
					vec2 ruv = vReflCoord.xy / vReflCoord.w + nW.xz * vec2( 0.06, 0.06 );
					float rgh = clamp( roughnessFactor, 0.0, 1.0 );
					float lod = rgh * 5.5;
					vec3 refl = vec3( 0.0 );
					float wsum = 0.0;
					for ( int i = -3; i <= 3; i ++ ) {
						float fi = float( i );
						float w = exp( - fi * fi / 5.0 );
						refl += textureLod( tReflect, ruv + vec2( 0.0, fi * rgh * 0.022 ), lod ).rgb * w;
						wsum += w;
					}
					refl /= wsum;
					vec3 V = normalize( cameraPosition - vWPos );
					float cosT = clamp( dot( nW, V ), 0.0, 1.0 );
					float F = 0.02 + 0.98 * pow( 1.0 - cosT, 5.0 );
					float amt = F * wet * mix( 0.45, 1.0, puddle ) * uWet.z;
					outgoingLight = outgoingLight * ( 1.0 - amt * 0.5 ) + refl * amt;
				}
				#include <opaque_fragment>` );

	};

	return m;

}

const platformTopMat = makeWetMaterial( {
	map: TX.platform.map, normalMap: TX.platform.normalMap, roughnessMap: TX.platform.roughnessMap,
	roughness: 1.0, metalness: 0.0, envMapIntensity: 0.35, normalScale: new THREE.Vector2( 0.8, 0.8 )

function updateMirror( R ) {

	const mirrorCam = R.cam, Y = R.y;
	camera.updateMatrixWorld();
	const cp = new THREE.Vector3().setFromMatrixPosition( camera.matrixWorld );
	const fwd = new THREE.Vector3( 0, 0, - 1 ).transformDirection( camera.matrixWorld );
	const up = new THREE.Vector3( 0, 1, 0 ).transformDirection( camera.matrixWorld );
	mirrorCam.position.set( cp.x, 2 * Y - cp.y, cp.z );
	mirrorCam.up.set( up.x, - up.y, up.z );
	mirrorCam.lookAt( cp.x + fwd.x, 2 * Y - ( cp.y + fwd.y ), cp.z + fwd.z );
	mirrorCam.fov = camera.fov; mirrorCam.aspect = camera.aspect; mirrorCam.near = camera.near; mirrorCam.far = camera.far;
	mirrorCam.updateProjectionMatrix();
	mirrorCam.updateMatrixWorld();
	R.matrix.set( 0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1 )
		.multiply( mirrorCam.projectionMatrix ).multiply( mirrorCam.matrixWorldInverse );
	// oblique near plane = the water plane, so nothing below it leaks in
	const plane = new THREE.Plane( new THREE.Vector3( 0, 1, 0 ), - Y ).applyMatrix4( mirrorCam.matrixWorldInverse );
	const clip = new THREE.Vector4( plane.normal.x, plane.normal.y, plane.normal.z, plane.constant );
	const pm = mirrorCam.projectionMatrix, e = pm.elements, q = new THREE.Vector4();
	q.x = ( Math.sign( clip.x ) + e[ 8 ] ) / e[ 0 ];
	q.y = ( Math.sign( clip.y ) + e[ 9 ] ) / e[ 5 ];
	q.z = - 1.0;
	q.w = ( 1.0 + e[ 10 ] ) / e[ 14 ];
	clip.multiplyScalar( 2.0 / clip.dot( q ) );
	e[ 2 ] = clip.x; e[ 6 ] = clip.y; e[ 10 ] = clip.z + 1.0 - 0.003; e[ 14 ] = clip.w;
	mirrorCam.projectionMatrixInverse.copy( pm ).invert();

}

const NOISE_GLSL = /* glsl */`
float hash12( vec2 p ) { vec3 p3 = fract( vec3( p.xyx ) * 0.1031 ); p3 += dot( p3, p3.yzx + 33.33 ); return fract( ( p3.x + p3.y ) * p3.z ); }
float vnoise( vec2 p ) {
	vec2 i = floor( p ), f = fract( p );
	vec2 u = f * f * ( 3.0 - 2.0 * f );
	return mix( mix( hash12( i ), hash12( i + vec2( 1, 0 ) ), u.x ), mix( hash12( i + vec2( 0, 1 ) ), hash12( i + vec2( 1, 1 ) ), u.x ), u.y );
}
float fbm2( vec2 p ) {
	float s = 0.0, a = 0.5;
	for ( int i = 0; i < 5; i ++ ) { s += a * vnoise( p ); p = p * 2.03 + vec2( 17.1, 9.2 ); a *= 0.5; }
	return s;
}`;

const skyMat = new THREE.ShaderMaterial( {
	uniforms: { fogColor: U.fogColor, uTime: U.time },
	vertexShader: /* glsl */`
		varying vec3 vDir;
		void main() {
			vDir = position;
			vec4 p = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
			gl_Position = p.xyww;
		}`,
	fragmentShader: /* glsl */`
		uniform vec3 fogColor;
		uniform float uTime;
		varying vec3 vDir;
		${ATMOS_GLSL}
		${NOISE_GLSL}
		void main() {
			vec3 d = normalize( vDir );
			vec3 horizon = atmosColor( d, fogColor );
			vec3 zenith = vec3( 0.075, 0.095, 0.12 );
			float h = max( d.y, 0.0 );
			vec3 col = mix( horizon, zenith, pow( smoothstep( 0.0, 0.7, h ), 0.7 ) );
			vec2 uv = d.xz / ( d.y + 0.09 );
			float n = fbm2( uv * 0.45 + vec2( uTime * 0.006, 0.0 ) );
			float n2 = fbm2( uv * 1.5 - vec2( uTime * 0.01, 0.0 ) );
			float cloud = smoothstep( 0.34, 0.62, n * 0.7 + n2 * 0.3 );
			float s = max( dot( d, SUN_DIR ), 0.0 );
			float lit = pow( s, 3.0 );
			// dark rain-cloud bellies, silver edges where the cover thins towards the sun
			float edge = smoothstep( 0.25, 0.75, n2 ) * ( 1.0 - cloud );
			vec3 cloudCol = mix( vec3( 0.085, 0.10, 0.12 ), vec3( 0.62, 0.60, 0.58 ), lit * 0.85 + ( 1.0 - cloud ) * 0.18 );
			col = mix( col, cloudCol, cloud * smoothstep( 0.0, 0.2, h ) * 0.9 );
			col += vec3( 1.0, 0.86, 0.68 ) * edge * lit * 0.55;
			col += vec3( 1.0, 0.9, 0.76 ) * ( pow( s, 10.0 ) * 0.5 + pow( s, 120.0 ) * 1.6 ) * ( 1.0 - cloud * 0.7 );
			col = mix( col, horizon, exp( - h * 22.0 ) * 0.75 );
			if ( d.y < 0.0 ) col = mix( horizon, horizon * 0.55, smoothstep( 0.0, -0.25, d.y ) );
			gl_FragColor = vec4( col, 1.0 );
		}`,
	side: THREE.BackSide,
	depthWrite: false,
	fog: false
} );
const sky = new THREE.Mesh( new THREE.SphereGeometry( 2500, 48, 24 ), skyMat );
sky.renderOrder = - 10;

// volumetric light registry: shared by the fog pass and the rain/petal shaders
const MAXL = 16;
const LIGHT_U = {
	uNumLights: { value: 0 },
	uLPos: { value: Array.from( { length: MAXL }, () => new THREE.Vector4() ) },
	uLDir: { value: Array.from( { length: MAXL }, () => new THREE.Vector4() ) },
	uLCol: { value: Array.from( { length: MAXL }, () => new THREE.Vector4() ) }
};
const vLights = [];

function spot( color, intensity, pos, target, { angle = 1.0, penumbra = 0.7, distance = 18, shadow = false, fogGain = 1 } = {} ) {

	const l = new THREE.SpotLight( color, intensity, distance, angle, penumbra, 2 );
	l.position.copy( pos ); l.target.position.copy( target );
	if ( shadow ) {

		l.castShadow = true;
		l.shadow.mapSize.set( Q.shadow / 2, Q.shadow / 2 );
		l.shadow.camera.near = 0.2; l.shadow.camera.far = distance;
		l.shadow.radius = 5; l.shadow.bias = - 0.0006; l.shadow.normalBias = 0.02;

	}

	scene.add( l, l.target );
	vLights.push( { light: l, gain: fogGain } );
	return l;

}

function point( color, intensity, pos, { distance = 10, fogGain = 1 } = {} ) {

	const l = new THREE.PointLight( color, intensity, distance, 2 );
	l.position.copy( pos );
	scene.add( l );
	vLights.push( { light: l, gain: fogGain } );
	return l;

}

// fog-only light (visible glow in the mist, no surface lighting – far lamps)
function fogLight( color, intensity, pos, range ) {

	const e = { color: new THREE.Color( color ), intensity, pos: pos.clone(), range, gain: 1 };
	vLights.push( e );
	return e;

}

const _lp = new THREE.Vector3(), _lt = new THREE.Vector3(), _lc = new THREE.Color();
function updateLightUniforms() {

	const n = Math.min( vLights.length, MAXL );
	LIGHT_U.uNumLights.value = n;
	for ( let i = 0; i < n; i ++ ) {

		const e = vLights[ i ];
		const P = LIGHT_U.uLPos.value[ i ], D = LIGHT_U.uLDir.value[ i ], C = LIGHT_U.uLCol.value[ i ];
		if ( e.light ) {

			const l = e.light;
			l.getWorldPosition( _lp );
			_lc.copy( l.color ).multiplyScalar( l.intensity * e.gain );
			P.set( _lp.x, _lp.y, _lp.z, l.distance || 30 );
			if ( l.isSpotLight ) {

				l.target.getWorldPosition( _lt );
				_lt.sub( _lp ).normalize();
				D.set( _lt.x, _lt.y, _lt.z, Math.cos( l.angle ) );
				C.set( _lc.r, _lc.g, _lc.b, Math.cos( l.angle * ( 1 - l.penumbra ) ) );

			} else {

				D.set( 0, - 1, 0, - 2 );
				C.set( _lc.r, _lc.g, _lc.b, 1 );

			}

		} else {

			_lc.copy( e.color ).multiplyScalar( e.intensity * e.gain );
			P.set( e.pos.x, e.pos.y, e.pos.z, e.range );
			D.set( 0, - 1, 0, - 2 );
			C.set( _lc.r, _lc.g, _lc.b, 1 );

		}

	}

}

const LIGHTS_GLSL = /* glsl */`
#define MAXL ${MAXL}
uniform int uNumLights;
uniform vec4 uLPos[ MAXL ];
uniform vec4 uLDir[ MAXL ];
uniform vec4 uLCol[ MAXL ];
float hgPhase( float c, float g ) {
	float g2 = g * g;
	return ( 1.0 - g2 ) / ( 12.566 * pow( max( 1.0 + g2 - 2.0 * g * c, 1e-3 ), 1.5 ) );
}
// radiance scattered toward the viewer at p (viewDir = camera -> p)
vec3 lightAt( vec3 p, vec3 viewDir, float g ) {
	vec3 sum = vec3( 0.0 );
	for ( int i = 0; i < MAXL; i ++ ) {
		if ( i >= uNumLights ) break;
		vec3 toL = uLPos[ i ].xyz - p;
		float d2 = dot( toL, toL );
		float range = uLPos[ i ].w;
		if ( d2 > range * range ) continue;
		float d = sqrt( d2 );
		vec3 l = toL / d;
		float x = d / range;
		float att = clamp( 1.0 - x * x * x * x, 0.0, 1.0 );
		att = att * att / max( d2, 0.12 );
		float cone = 1.0;
		if ( uLDir[ i ].w > -1.5 ) cone = smoothstep( uLDir[ i ].w, uLCol[ i ].w, dot( -l, uLDir[ i ].xyz ) );
		sum += uLCol[ i ].rgb * att * cone * hgPhase( dot( viewDir, l ), g );
	}
	return sum;
}`;

const statics = new Batch();
{

	const W = PLAT.x1 - PLAT.x0, L = PLAT.z1 - PLAT.z0;

	// coping lip (overhangs the recessed wall) + body
	statics.box( 0.5, 0.2, L, MAT.concrete, { x: 0.2, y: - 0.102, z: ( PLAT.z0 + PLAT.z1 ) / 2, uv: 1.5 } );
	statics.box( W - 0.35, - GROUND_Y - 0.2, L, MAT.concreteDark, { x: PLAT.x0 + 0.35 + ( W - 0.35 ) / 2, y: ( GROUND_Y - 0.2 ) / 2, z: ( PLAT.z0 + PLAT.z1 ) / 2, uv: 2 } );
	// end ramp
	const rampLen = 6, ang = Math.atan2( - GROUND_Y, rampLen );
	statics.box( W, 0.3, Math.hypot( rampLen, GROUND_Y ), MAT.concreteDark, { x: ( PLAT.x0 + PLAT.x1 ) / 2, y: GROUND_Y / 2 - 0.15, z: PLAT.z0 - rampLen / 2, rx: - ang, uv: 2 } );

	// mesh fence along the back edge: pipe posts, top/bottom rails, diamond wire panels
	const fz0 = PLAT.z0 + 1, fz1 = PLAT.z1 - 1, zmid = ( fz0 + fz1 ) / 2;
	for ( let z = fz0; z <= fz1 + 0.01; z += 2.0 ) {

		statics.cyl( 0.024, 0.024, 1.15, MAT.fence, { x: 5.42, y: 0.575, z }, 8 );

	}

	for ( const y of [ 1.12, 0.08 ] ) statics.cyl( 0.019, 0.019, fz1 - fz0, MAT.fence, { x: 5.42, y, z: zmid, rx: Math.PI / 2 }, 8 );
	const panel = new THREE.PlaneGeometry( fz1 - fz0, 1.02 ).rotateY( Math.PI / 2 ).translate( 5.42, 0.6, zmid );
	worldUV( panel, 0.5 );
	const fenceMesh = new THREE.Mesh( panel, MAT.fenceMesh );
	fenceMesh.castShadow = true; fenceMesh.receiveShadow = true; fenceMesh.userData.noAO = true;
	scene.add( fenceMesh );
	// platform wall: expansion joints and weep holes
	for ( let z = PLAT.z0 + 5; z < PLAT.z1; z += 5 ) {

		statics.box( 0.012, - GROUND_Y - 0.25, 0.025, MAT.plastic, { x: 0.345, y: ( GROUND_Y - 0.2 ) / 2, z } );
		statics.cyl( 0.035, 0.035, 0.02, MAT.hole, { x: 0.345, y: GROUND_Y + 0.35, z: z + 2.5, rz: Math.PI / 2 }, 10 );

	}

const barkBatch = new Batch();
const blossomData = [];     // { pos, quat, scale, nrm, atlas, color }

function makeSakura( seed, base, { scale = 1, bias = new THREE.Vector3(), density = 1, maxDepth = 3, trunk = 2.6 } = {} ) {

	const r = mulberry32( seed );
	const rt = mulberry32( seed + 7919 );     // separate stream for twigs so the main structure stays as designed
	const anchors = [];
	const grow = ( p0, dir, len, rad, depth ) => {

		const segs = depth === 0 ? 5 : 4;
		const pts = [ p0.clone() ];
		const d = dir.clone();
		let p = p0.clone();
		for ( let i = 1; i <= segs; i ++ ) {

			d.x += ( r() - 0.5 ) * 0.55; d.y += ( r() - 0.5 ) * 0.3; d.z += ( r() - 0.5 ) * 0.55;
			if ( depth >= 2 ) d.y -= 0.14;
			if ( depth === 0 ) d.y += 0.3;
			d.normalize();
			p = p.clone().addScaledVector( d, len / segs );
			pts.push( p );

		}

		const rEnd = rad * ( depth === 0 ? 0.7 : 0.42 );
		barkBatch.add( taperTube( pts, rad, rEnd, depth < 2 ? 8 : 5 ), MAT.bark );
		if ( depth >= 1 ) for ( let i = 2; i < pts.length; i ++ ) anchors.push( { p: pts[ i ], w: depth } );
		if ( depth < maxDepth ) {

const PART_DEFS = /* glsl */`

#define PLAT_X1 ${f4( PLAT.x1 )}
#define PLAT_Z0 ${f4( PLAT.z0 )}
#define PLAT_Z1 ${f4( PLAT.z1 )}
#define GROUND_Y ${f4( GROUND_Y )}
#define CAN_X0 ${f4( CANOPY.x0 - 0.15 )}
#define CAN_X1 ${f4( CANOPY.x1 + 0.15 )}
#define CAN_Z0 ${f4( CANOPY.z0 - 0.15 )}
#define CAN_Z1 ${f4( CANOPY.z1 + 0.15 )}
#define CAN_Y ${f4( CANOPY.y + 0.3 )}
uniform float uTime;
uniform vec3 fogColor;
uniform float fogDensity;
${ATMOS_GLSL}
${LIGHTS_GLSL}
float surfaceY( vec2 xz ) {
	return ( xz.x > PLAT_X0 && xz.x < PLAT_X1 && xz.y > PLAT_Z0 && xz.y < PLAT_Z1 ) ? 0.0 : GROUND_Y + 0.12;

bool roofed( vec3 p ) {
	return p.x > CAN_X0 && p.x < CAN_X1 && p.z > CAN_Z0 && p.z < CAN_Z1 && p.y < CAN_Y;

class ScenePass extends Pass {

	constructor( scene, camera ) {

		super();
		this.scene = scene; this.camera = camera;
		this.needsSwap = false;
		const dt = new THREE.DepthTexture( 1, 1 );
		dt.type = THREE.UnsignedIntType;
		this.rt = new THREE.WebGLRenderTarget( 1, 1, { type: THREE.HalfFloatType, samples: Q.msaa, depthTexture: dt } );
		this.copy = new FullScreenQuad( new THREE.ShaderMaterial( { ...CopyShader, uniforms: THREE.UniformsUtils.clone( CopyShader.uniforms ) } ) );

	}
	setSize( w, h ) { this.rt.setSize( w, h ); }
	render( renderer, writeBuffer, readBuffer ) {

		renderer.setRenderTarget( this.rt );
		renderer.render( this.scene, this.camera );
		this.stats = { calls: renderer.info.render.calls, tris: renderer.info.render.triangles };
		this.copy.material.uniforms.tDiffuse.value = this.rt.texture;
		renderer.setRenderTarget( readBuffer );
		this.copy.render( renderer );

	}

}

class StationSSAOPass extends SSAOPass {

	_overrideVisibility() {

		const cache = this._visibilityCache;
		this.scene.traverse( ( o ) => {

			if ( ( o.isPoints || o.isLine || o.userData.noAO ) && o.visible ) { o.visible = false; cache.push( o ); }

		} );

	}

}

				// falling rain sheets: noise stretched vertically and scrolling down
				float rainSheet( vec3 p ) {
					return smoothstep( 0.45, 0.85, texture( tNoise, vec3( p.x * 0.55, p.y * 0.03 + uTime * 0.75, p.z * 0.55 ) ).r );
				}
				void main() {
					vec4 base = texture2D( tDiffuse, vUv );
					float depth = texture2D( tDepth, vUv ).r;
					vec4 vp = uProjInv * vec4( vUv * 2.0 - 1.0, depth * 2.0 - 1.0, 1.0 );
					vp /= vp.w;
					vec3 wp = ( uCamWorld * vp ).xyz;
					vec3 ray = wp - uCamPos;
					float dist = length( ray );
					vec3 dir = ray / dist;
					float tMax = min( dist, uMaxDist );
					float stepL = tMax / float( STEPS );
					// white-noise jitter: reads as film grain instead of the grid pattern IGN leaves in bright beams
					vec3 p3 = fract( vec3( gl_FragCoord.xy, uFrame ) * vec3( 0.1031, 0.1030, 0.0973 ) );
					p3 += dot( p3, p3.yzx + 33.33 );
					float jit = fract( ( p3.x + p3.y ) * p3.z );
					vec3 mistCol = atmosColor( dir, fogColor );
					vec3 scat = vec3( 0.0 );
					float T = 1.0;
					// 1) ambient mist banks and distant rain sheets: plain jittered march
					for ( int i = 0; i < STEPS; i ++ ) {
						float t = ( float( i ) + jit ) * stepL;
						vec3 p = uCamPos + dir * t;
						float n = mediumNoise( p );
						float hMask = exp( - max( p.y - FOG_BASE, 0.0 ) * 0.45 );
						float mist = uMist * hMask * smoothstep( 0.42, 0.78, n ) + uMist * 0.35 * rainSheet( p ) * smoothstep( 8.0, 30.0, t );
						scat += T * stepL * mist * mistCol;
						T *= exp( - mist * stepL );
					}
					// 2) lamp light scattered by the rain-laden air: equi-angular sampling per light
					//    (samples cluster where the ray passes the lamp, and the 1/d² falloff cancels
					//    against the pdf, so beams stay clean instead of grainy)
					float jit2 = fract( jit * 7.31 + 0.37 );
					for ( int li = 0; li < MAXL; li ++ ) {
						if ( li >= uNumLights ) break;
						vec3 Lp = uLPos[ li ].xyz;
						float range = uLPos[ li ].w;
						float delta = dot( Lp - uCamPos, dir );
						float D = length( uCamPos + dir * delta - Lp );
						if ( D > range ) continue;
						D = max( D, 0.03 );
						float thA = atan( - delta, D ), thB = atan( tMax - delta, D );
						if ( thB - thA < 1e-4 ) continue;
						float w = ( thB - thA ) / D / float( LSAMPLES );
						vec3 acc = vec3( 0.0 );
						for ( int k = 0; k < LSAMPLES; k ++ ) {
							float t = delta + D * tan( mix( thA, thB, ( float( k ) + jit2 ) / float( LSAMPLES ) ) );
							vec3 p = uCamPos + dir * t;
							vec3 toL = Lp - p;
							float d = length( toL );
							vec3 l = toL / d;
							float x = d / range;
							float win = clamp( 1.0 - x * x * x * x, 0.0, 1.0 );
							float cone = uLDir[ li ].w > -1.5 ? smoothstep( uLDir[ li ].w, uLCol[ li ].w, dot( - l, uLDir[ li ].xyz ) ) : 1.0;
							float medium = uDensity * ( 0.45 + 0.8 * mediumNoise( p ) + 1.2 * rainSheet( p ) );
							acc += win * win * cone * hgPhase( dot( dir, l ), 0.45 ) * medium * exp( - uMist * 0.3 * t );
						}
						scat += uLCol[ li ].rgb * acc * w;
					}
					gl_FragColor = vec4( base.rgb * T + scat, base.a );
				}`
		} );
		this.fsQuad = new FullScreenQuad( this.material );

	}
	render( renderer, writeBuffer, readBuffer ) {

		const u = this.material.uniforms;
		u.tDiffuse.value = readBuffer.texture;
		u.uProjInv.value.copy( this.camera.projectionMatrixInverse );
		u.uCamWorld.value.copy( this.camera.matrixWorld );
		u.uCamPos.value.setFromMatrixPosition( this.camera.matrixWorld );
		u.uFrame.value = SHOT ? 0 : ( u.uFrame.value + 1 ) % 64;
		renderer.setRenderTarget( this.renderToScreen ? null : writeBuffer );
		this.fsQuad.render( renderer );

	}

}

// 光芒: light shafts streaming from the bright break in the clouds, occluded by
// everything that is not sky (trees, wires, canopy) – screen-space radial march.
class GodRaysPass extends Pass {

	constructor( camera, depthTexture ) {

		super();
		this.camera = camera;
		this.material = new THREE.ShaderMaterial( {
			defines: { SAMPLES: 64 },
			uniforms: {
				tDiffuse: { value: null }, tDepth: { value: depthTexture },
				uSun: { value: new THREE.Vector2( 0.3, 0.7 ) }, uVisible: { value: 1 },
				uIntensity: { value: 2.2 }, uDecay: { value: 0.972 }, uSpan: { value: 0.95 }, uThreshold: { value: 0.3 },
				uTint: { value: new THREE.Color( 1.0, 0.86, 0.66 ) }, uAspect: { value: 1.7 }
			},
			vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4( position.xy, 0.0, 1.0 ); }',
			fragmentShader: /* glsl */`
				uniform sampler2D tDiffuse;
				uniform sampler2D tDepth;
				uniform vec2 uSun;
				uniform float uVisible, uIntensity, uDecay, uSpan, uThreshold, uAspect;
				uniform vec3 uTint;
				varying vec2 vUv;
				void main() {
					vec3 base = texture2D( tDiffuse, vUv ).rgb;
					vec2 delta = ( vUv - uSun ) * ( uSpan / float( SAMPLES ) );
					float jit = fract( 52.9829189 * fract( dot( gl_FragCoord.xy, vec2( 0.06711056, 0.00583715 ) ) ) );
					vec2 uv = vUv - delta * jit;
					float illum = 1.0, acc = 0.0;
					for ( int i = 0; i < SAMPLES; i ++ ) {
						uv -= delta;
						float sky = step( 0.99999, texture2D( tDepth, uv ).r );
						vec3 c = texture2D( tDiffuse, uv ).rgb;
						acc += sky * max( dot( c, vec3( 0.2126, 0.7152, 0.0722 ) ) - uThreshold, 0.0 ) * illum;
						illum *= uDecay;
					}
					vec2 d = ( vUv - uSun ) * vec2( uAspect, 1.0 );
					float falloff = 1.0 / ( 1.0 + dot( d, d ) * 3.0 );
					acc *= uIntensity * falloff / float( SAMPLES );
					gl_FragColor = vec4( base + uTint * acc * uVisible, 1.0 );
				}`
		} );
		this.fsQuad = new FullScreenQuad( this.material );
		this._v = new THREE.Vector3();

	}
	render( renderer, writeBuffer, readBuffer ) {

		const u = this.material.uniforms;
		const cp = this.camera.position;
		this._v.copy( SUN_DIR ).multiplyScalar( 1000 ).add( cp ).project( this.camera );
		u.uSun.value.set( this._v.x * 0.5 + 0.5, this._v.y * 0.5 + 0.5 );
		const fwd = this.camera.getWorldDirection( _v );
		u.uVisible.value = smoothstep( 0.2, 0.6, fwd.dot( SUN_DIR ) );
		u.uAspect.value = this.camera.aspect;
		u.tDiffuse.value = readBuffer.texture;
		renderer.setRenderTarget( this.renderToScreen ? null : writeBuffer );
		this.fsQuad.render( renderer );

	}

}

class FXPass extends Pass {

	constructor( scene, camera ) { super(); this.scene = scene; this.camera = camera; this.needsSwap = false; }
	render( renderer, writeBuffer, readBuffer ) {

		const ac = renderer.autoClear;
		renderer.autoClear = false;
		renderer.setRenderTarget( readBuffer );
		renderer.render( this.scene, this.camera );
		renderer.autoClear = ac;

	}

}

const GradeShader = {
	uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2( 1, 1 ) } },
	vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }',
	fragmentShader: /* glsl */`
		uniform sampler2D tDiffuse;
		uniform float uTime;
		uniform vec2 uRes;
		varying vec2 vUv;
		float h( vec2 p ) { vec3 p3 = fract( vec3( p.xyx ) * 0.1031 ); p3 += dot( p3, p3.yzx + 33.33 ); return fract( ( p3.x + p3.y ) * p3.z ); }
		void main() {
			vec2 c = vUv - 0.5;
			float ca = dot( c, c ) * 0.006;
			vec3 col;
			col.r = texture2D( tDiffuse, vUv - c * ca ).r;
			col.g = texture2D( tDiffuse, vUv ).g;
			col.b = texture2D( tDiffuse, vUv + c * ca ).b;
			float l = dot( col, vec3( 0.2126, 0.7152, 0.0722 ) );
			// split toning: teal shadows, warm highlights
			col *= mix( vec3( 0.86, 0.98, 1.10 ), vec3( 1.04, 1.0, 0.95 ), smoothstep( 0.2, 0.9, l ) );
			// filmic S-curve: deeper darks, gentle shoulder
			col = clamp( col, 0.0, 1.0 );
			col = mix( col, col * col * ( 3.0 - 2.0 * col ), 0.32 );
			col += vec3( 0.0, 0.006, 0.016 ) * ( 1.0 - l );
			col = mix( vec3( dot( col, vec3( 0.2126, 0.7152, 0.0722 ) ) ), col, 1.1 );
			float v = smoothstep( 0.95, 0.3, length( c * vec2( 1.0, 0.8 ) ) );
			col *= mix( 0.7, 1.0, v );
			col += ( h( vUv * uRes + fract( uTime * 7.13 ) * 311.0 ) - 0.5 ) * 0.03 * ( 1.0 - 0.6 * l );
			gl_FragColor = vec4( col, 1.0 );
		}`
};

const composer = new EffectComposer( renderer );
composer.setPixelRatio( Q.pr );
const scenePass = new ScenePass( scene, camera );
const ssaoPass = new StationSSAOPass( scene, camera, 16, 16, Q.ssao );
ssaoPass.kernelRadius = 0.55;
ssaoPass.minDistance = 0.02 / camera.far;
ssaoPass.maxDistance = 0.9 / camera.far;
const fogPass = new VolumetricFogPass( camera, scenePass.rt.depthTexture );
const fxPass = new FXPass( fxScene, camera );
const raysPass = new GodRaysPass( camera, scenePass.rt.depthTexture );
const bloomPass = new UnrealBloomPass( new THREE.Vector2( 256, 256 ), 0.7, 0.8, 1.5 );
// warmer wide mips -> soft film-like halation around lamps, against the cool mist
[ [ 1, 1, 1 ], [ 1, 0.97, 0.94 ], [ 1, 0.93, 0.86 ], [ 1, 0.9, 0.8 ], [ 1, 0.88, 0.78 ] ].forEach( ( c, i ) => bloomPass.bloomTintColors[ i ].set( ...c ) );
const outputPass = new OutputPass();
const gradePass = new ShaderPass( GradeShader );
composer.addPass( scenePass );
composer.addPass( ssaoPass );
composer.addPass( fogPass );
composer.addPass( raysPass );
composer.addPass( fxPass );
composer.addPass( bloomPass );
composer.addPass( outputPass );
composer.addPass( gradePass );
PART_U.tDepth.value = scenePass.rt.depthTexture;

if ( DEBUG.includes( 'noao' ) ) ssaoPass.enabled = false;
if ( DEBUG.includes( 'ao' ) && ! DEBUG.includes( 'noao' ) ) { ssaoPass.output = SSAOPass.OUTPUT.Blur; fogPass.enabled = fxPass.enabled = bloomPass.enabled = gradePass.enabled = false; }
if ( DEBUG.includes( 'nofog' ) ) fogPass.enabled = false;
if ( DEBUG.includes( 'nofx' ) ) fxPass.enabled = false;
if ( DEBUG.includes( 'nobloom' ) ) bloomPass.enabled = false;
if ( DEBUG.includes( 'norays' ) ) raysPass.enabled = false;

// ============================================================================
// Resize, input
// ============================================================================
function resize() {

	const w = innerWidth, h = innerHeight;
	camera.aspect = w / h;
	camera.updateProjectionMatrix();
	renderer.setSize( w, h, false );
	composer.setSize( w, h );
	const rw = Math.round( w * Q.pr ), rh = Math.round( h * Q.pr );
	for ( const R of Object.values( REFL ) ) R.rt.setSize( Math.max( 2, Math.round( rw * Q.refl ) ), Math.max( 2, Math.round( rh * Q.refl ) ) );
	PART_U.uRes.value.set( rw, rh );
	const pxScale = rh / ( 2 * Math.tan( THREE.MathUtils.degToRad( camera.fov ) / 2 ) );
	PART_U.uPixelAngle.value = 1 / pxScale;
	splashU.uPxScale.value = petalU.uPxScale.value = petalTreeU.uPxScale.value = petalNearU.uPxScale.value = pxScale;
	gradePass.uniforms.uRes.value.set( rw, rh );

}

addEventListener( 'resize', resize );
resize();

const look = { yaw: 0, pitch: 0, tYaw: 0, tPitch: 0, drag: null };
canvas.addEventListener( 'pointerdown', ( e ) => { look.drag = { x: e.clientX, y: e.clientY, yaw: look.tYaw, pitch: look.tPitch }; canvas.setPointerCapture( e.pointerId ); } );
canvas.addEventListener( 'pointermove', ( e ) => {

	if ( ! look.drag ) return;
	look.tYaw = THREE.MathUtils.clamp( look.drag.yaw - ( e.clientX - look.drag.x ) * 0.0025, - 0.6, 0.6 );
	look.tPitch = THREE.MathUtils.clamp( look.drag.pitch - ( e.clientY - look.drag.y ) * 0.002, - 0.25, 0.3 );

} );
addEventListener( 'pointerup', () => { look.drag = null; } );
let paused = false, uiHidden = SHOT;
addEventListener( 'keydown', ( e ) => {

	if ( e.code === 'Space' ) paused = ! paused;
	if ( e.code === 'KeyH' ) { uiHidden = ! uiHidden; document.getElementById( 'title' ).classList.toggle( 'hidden', uiHidden ); document.getElementById( 'hint' ).classList.toggle( 'hidden', uiHidden ); }

} );

// ============================================================================
// Frame
// ============================================================================
const timer = new THREE.Timer();
let simTime = FIXED_T ?? 8;
let frames = 0;
const baseDir = new THREE.Vector3().subVectors( CAM_BASE.target, CAM_BASE.pos ).normalize();
const fwd = new THREE.Vector3();

function update( t ) {

	U.time.value = t % 1000;
	gradePass.uniforms.uTime.value = t;

	// camera: gentle handheld breathing + drag look
	look.yaw += ( look.tYaw - look.yaw ) * 0.08;
	look.pitch += ( look.tPitch - look.pitch ) * 0.08;
	const sway = SHOT ? 0 : 1;
	camera.position.copy( CAM_BASE.pos ).add( new THREE.Vector3( Math.sin( t * 0.21 ) * 0.03, Math.sin( t * 0.33 ) * 0.02, 0 ).multiplyScalar( sway ) );
	const dir = baseDir.clone().applyAxisAngle( new THREE.Vector3( 0, 1, 0 ), look.yaw + Math.sin( t * 0.13 ) * 0.006 * sway );
	const right = new THREE.Vector3().crossVectors( dir, new THREE.Vector3( 0, 1, 0 ) ).normalize();
	dir.applyAxisAngle( right, look.pitch + Math.sin( t * 0.17 ) * 0.004 * sway );
	camera.lookAt( fwd.copy( camera.position ).add( dir ) );
	camera.updateMatrixWorld();

	sky.position.copy( camera.position );

	// level crossing: alternating flashers (~50 flashes/min per lamp)
	const ph = t * 0.85 * Math.PI * 2;
	const a = smoothstep( - 0.15, 0.15, Math.sin( ph ) ), b = 1 - a;
	MAT.redLamp.color.setRGB( 0.05 + a * 14, 0.01 + a * 1.2, 0.005 + a * 0.5 );
	MAT.redLamp2.color.setRGB( 0.05 + b * 14, 0.01 + b * 1.2, 0.005 + b * 0.5 );
	for ( const c of crossingLights ) c.light.intensity = 9 + 7 * Math.abs( Math.sin( ph ) );

	// particles follow the viewer
	camera.getWorldDirection( fwd );
	rainU.uBoxCenter.value.copy( camera.position ).addScaledVector( fwd, 14 ).setY( camera.position.y + 3 );
	petalU.uBoxCenter.value.copy( camera.position ).addScaledVector( fwd, 12 ).setY( camera.position.y + 4 );
	splashU.uCenter.value.copy( camera.position ).addScaledVector( fwd, 12 );
	petalNearU.uBoxCenter.value.copy( camera.position ).addScaledVector( fwd, 4.5 ).setY( camera.position.y + 1.5 );
	rainNearU.uBoxCenter.value.copy( camera.position ).addScaledVector( fwd, 3.2 ).setY( camera.position.y + 1.2 );
	U.fogDensity.value = scene.fog.density;

	updateLightUniforms();

}

function render() {

	renderer.shadowMap.needsUpdate = true;
	for ( const R of Object.values( REFL ) ) {

		updateMirror( R );
		R.hide.forEach( ( o ) => ( o.visible = false ) );
		renderer.setRenderTarget( R.rt );
		renderer.render( scene, R.cam );
		R.hide.forEach( ( o ) => ( o.visible = true ) );

	}

	renderer.setRenderTarget( null );
	composer.render( 1 / 60 );

}

// live mode only: if the GPU cannot hold ~30 fps, step the render scale down (at most twice)
const perf = { sum: 0, n: 0, steps: 0 };
function adaptResolution( dt ) {

	if ( SHOT || qs.has( 'q' ) || frames < 20 || perf.steps >= 2 ) return;
	perf.sum += dt; perf.n ++;
	if ( perf.n < 60 ) return;
	const avg = perf.sum / perf.n;
	perf.sum = perf.n = 0;
	if ( avg > 1 / 28 && Q.pr > 0.6 ) {

		Q.pr = Math.max( 0.6, Q.pr * 0.78 );
		perf.steps ++;
		renderer.setPixelRatio( Q.pr );
		composer.setPixelRatio( Q.pr );
		resize();

	}

}

function frame() {

	timer.update();
	const dt = Math.min( timer.getDelta(), 0.05 );
	if ( FIXED_T === null && ! paused ) simTime += dt;
	const t0 = performance.now();
	update( simTime );
	render();
	frames ++;
	adaptResolution( dt );
	if ( frames === 1 ) {

		document.getElementById( 'loading' ).classList.add( 'hidden' );
		if ( ! uiHidden ) { document.getElementById( 'title' ).classList.remove( 'hidden' ); document.getElementById( 'hint' ).classList.remove( 'hidden' ); }

	}

	if ( SHOT && frames >= 3 ) {

		renderer.getContext().finish();
		window.__sceneStats = { ms: Math.round( performance.now() - t0 ), ...scenePass.stats, blossoms: blossomData.length, fallenPetals: scene.getObjectByName( 'groundPetals' ).count, lights: vLights.length };
		window.__sceneReady = true;
		return;

	}

	requestAnimationFrame( frame );

}

requestAnimationFrame( frame );
</script>
</body>
